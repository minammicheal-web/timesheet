name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ['android-key/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The signing key is made once and saved in the repository, so every new
      # version installs over the old one and your saved data is kept.
      - name: Signing key
        run: |
          mkdir -p android-key
          if [ ! -f android-key/timesheet.jks ]; then
            keytool -genkeypair -keystore android-key/timesheet.jks -alias timesheet \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass timesheet123 -keypass timesheet123 \
              -dname "CN=Time Sheet, O=Personal, C=EG"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add android-key/timesheet.jks
            git commit -m "Add app signing key"
            git push
          fi

      - name: Create Android project
        run: |
          P=build-android
          mkdir -p $P/app/src/main/java/com/mina/timesheet $P/app/src/main/assets $P/app/src/main/res/mipmap-xxxhdpi
          cp index.html manifest.json icon-192.png icon-512.png $P/app/src/main/assets/
          cp icon-192.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'TimeSheet'
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def run = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
          android {
              namespace 'com.mina.timesheet'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.mina.timesheet'
                  minSdk 24
                  targetSdk 34
                  versionCode run as Integer
                  versionName "1.${run}"
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file('../android-key/timesheet.jks')
                      storePassword 'timesheet123'
                      keyAlias 'timesheet'
                      keyPassword 'timesheet123'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Time Sheet"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/mina/timesheet/MainActivity.java <<'EOF'
          package com.mina.timesheet;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int PICK = 1;
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  web.addJavascriptInterface(new Bridge(), "Android");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, p.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                          try {
                              startActivityForResult(Intent.createChooser(i, "Choose file"), PICK);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK || fileCallback == null) return;
                  Uri[] out = null;
                  if (res == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int n = data.getClipData().getItemCount();
                          out = new Uri[n];
                          for (int k = 0; k < n; k++) out[k] = data.getClipData().getItemAt(k).getUri();
                      } else if (data.getData() != null) {
                          out = new Uri[]{ data.getData() };
                      }
                  }
                  fileCallback.onReceiveValue(out);
                  fileCallback = null;
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              /** Lets the page save a backup file into the phone's Downloads folder. */
              private class Bridge {
                  @JavascriptInterface
                  public String saveFile(String name, String text) {
                      try {
                          byte[] bytes = text.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues cv = new ContentValues();
                              cv.put(MediaStore.Downloads.DISPLAY_NAME, name);
                              cv.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                              try (OutputStream o = getContentResolver().openOutputStream(u)) { o.write(bytes); }
                              return "Downloads";
                          } else {
                              File f = new File(getExternalFilesDir(null), name);
                              try (FileOutputStream o = new FileOutputStream(f)) { o.write(bytes); }
                              return f.getParent();
                          }
                      } catch (Exception e) {
                          return "";
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: build-android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp build-android/app/build/outputs/apk/release/app-release.apk TimeSheet.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Time Sheet ${{ github.run_number }}
          body: Download TimeSheet.apk below and open it on your phone to install or update.
          files: TimeSheet.apk
          make_latest: true
