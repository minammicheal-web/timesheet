<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Attendance &amp; Leave</title>
<style>
:root{
  --bg:#f3f6f8;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e5eaf0;
  --accent:#0f766e;--on-accent:#fff;--soft:#d9f2ee;--danger:#dc2626;--danger-soft:#fee2e2;
  --warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--info:#1d4ed8;--info-soft:#dbeafe;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05)}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#131c2e;--text:#e6edf6;--muted:#8da0b8;--line:#23304a;
    --accent:#2dd4bf;--on-accent:#04201c;--soft:#12332f;--danger:#f87171;--danger-soft:#3b1717;
    --warn:#fbbf24;--warn-soft:#3a2d0b;--ok:#4ade80;--ok-soft:#10301c;--info:#93c5fd;--info-soft:#16284a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;min-height:56px}
header h1{flex:1;margin:0;font-size:18px;font-weight:700}
header button{border:0;background:rgba(255,255,255,.18);color:inherit;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
header button.hide{visibility:hidden}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:13px}
h3{margin:0 0 12px;font-size:18px}
h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 0}
input,select,textarea{width:100%;margin-top:5px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent)}
textarea{min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{width:100%;padding:18px;font-size:19px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:inherit;
  padding:15px 16px;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.menu button:first-child{border-top:0}
.menu .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.menu .go{margin-left:auto;color:var(--muted);font-size:20px}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.red i{background:var(--danger)}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;
  border-top:1px solid var(--line);padding:11px 0;color:inherit;font:inherit;cursor:pointer}
.row:first-child{border-top:0}
.row.off{opacity:.55;padding:8px 0}
.row .d{font-weight:700;min-width:84px}
.row .r{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.row.today .d{color:var(--accent)}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.bad{background:var(--danger-soft);color:var(--danger)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.mute{background:var(--line);color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.line.t{border-top:1px solid var(--line);margin-top:4px;padding-top:11px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.filters label{margin:0}
.filters.one{grid-template-columns:1fr}
#modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:#0f172a;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.prev{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sub h4{margin:0}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk label{margin:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text)}
.chk input{width:auto;margin:0}
</style>
</head>
<body>
<header><button id="back" class="hide" aria-label="Back">‹</button><h1 id="title">Attendance</h1><button id="act" class="hide" aria-label="Add">+</button></header>
<main id="view"></main>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const TIME=/^\d\d:\d\d$/;
const tm=t=>{if(!TIME.test(t||''))return NaN;const p=t.split(':');return (+p[0])*60+(+p[1])};
const fm=m=>{m=Math.round(m);if(m<=0)return '0m';const h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'};
const fd=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayStr=()=>ymd(new Date());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dayShort=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const dayLong=s=>parseYmd(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const monthTitle=ym=>{const p=ym.split('-');return MONTHS[+p[1]-1]+' '+p[0]};

/* ================= data ================= */
const KEY='attendance.v1';
let mem=null;
function defaults(){return {days:{},periods:[],holidays:[],payslips:[],settings:{start:'08:30',end:'17:30',workDays:[0,1,2,3,4],annual:21,casual:6,sick:90,permHours:2}}}
function load(){
  const d=defaults();let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){raw=mem}
  if(raw){try{
    const p=JSON.parse(raw);
    if(p.days&&typeof p.days==='object')d.days=p.days;
    if(Array.isArray(p.periods))d.periods=p.periods;
    if(Array.isArray(p.holidays))d.holidays=p.holidays;
    if(Array.isArray(p.payslips))d.payslips=p.payslips;
    if(p.settings)Object.keys(d.settings).forEach(k=>{if(p.settings[k]!==undefined)d.settings[k]=p.settings[k]});
  }catch(e){}}
  return d;
}
let S=load();
function save(){const s=JSON.stringify(S);try{localStorage.setItem(KEY,s)}catch(e){mem=s}}

/* ================= calendar rules ================= */
const holidayOf=d=>S.holidays.find(h=>d>=h.from&&d<=(h.to||h.from));
function kindOf(d){
  if(!S.settings.workDays.includes(parseYmd(d).getDay()))return 'weekend';
  return holidayOf(d)?'holiday':'workday';
}
function schedule(d){
  let r={start:S.settings.start,end:S.settings.end,name:''};
  S.periods.forEach(p=>{if(d>=p.from&&d<=p.to)r={start:p.start,end:p.end,name:p.name}});
  return r;
}
function union(list){
  const v=list.filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]),out=[];
  v.forEach(x=>{const l=out[out.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else out.push([x[0],x[1]])});
  return out;
}
const covered=(un,a,b)=>un.reduce((s,x)=>s+Math.max(0,Math.min(x[1],b)-Math.max(x[0],a)),0);
const ranges=list=>(list||[]).map(x=>[tm(x.from),tm(x.to)]).filter(x=>x[0]===x[0]&&x[1]===x[1]&&x[1]>x[0]);

/* The core of all rules: one day record -> results */
function calc(rec){
  const date=rec.date,kind=kindOf(date),sch=schedule(date),type=rec.type||'work';
  const r={kind,sch,type,lateRaw:0,late:0,earlyRaw:0,early:0,perm:0,tripMin:0,ot:0,otMin:0,credit:0,
    leave:{annual:0,casual:0,sick:0,unpaid:0,half:0},incomplete:false,noOut:false};
  const perms=ranges(rec.perms),trips=ranges(rec.trips);
  r.perm=perms.reduce((a,x)=>a+x[1]-x[0],0);
  r.tripMin=trips.reduce((a,x)=>a+x[1]-x[0],0);
  const hasIn=TIME.test(rec.in||''),hasOut=TIME.test(rec.out||'');
  if(kind!=='workday'){                         /* weekend / holiday: whole hours = overtime */
    if(hasIn&&hasOut){
      let w=tm(rec.out)-tm(rec.in);if(w<0)w+=1440;
      r.otMin=w;
      if(kind==='holiday'&&rec.holidayMode==='leave')r.credit=1;else r.ot=Math.floor(w/60);
    }else if(hasIn)r.noOut=true;
    return r;
  }
  if(type==='annual'){r.leave.annual=1;return r}
  if(type==='casual'){r.leave.casual=1;return r}
  if(type==='sick'){r.leave.sick=1;return r}
  if(type==='unpaid'){r.leave.unpaid=1;return r}
  let expS=tm(sch.start),expE=tm(sch.end);
  if(type==='halfAM'){expS=13*60;r.leave.half=1}
  if(type==='halfPM'){expE=13*60;r.leave.half=1}
  r.expS=expS;r.expE=expE;
  const cov=union(perms.concat(trips));
  if(hasIn){
    const a=tm(rec.in);
    if(a>expS){r.lateRaw=Math.max(0,a-expS-covered(cov,expS,a));r.late=Math.ceil(r.lateRaw/30)*30}
  }
  if(hasOut){
    const b=tm(rec.out);
    if(b<expE){r.earlyRaw=Math.max(0,expE-b-covered(cov,b,expE));r.early=Math.ceil(r.earlyRaw/30)*30}
    else if(b>expE&&type==='work'){r.otMin=b-expE;r.ot=Math.floor(r.otMin/60)}
  }
  if(hasIn&&!hasOut)r.noOut=true;
  if(!hasIn&&!hasOut&&covered(cov,expS,expE)<expE-expS)r.incomplete=true;
  if(hasIn!==hasOut&&hasOut)r.incomplete=true;
  return r;
}

const TYPE_LABEL={annual:'Annual leave',casual:'Casual leave',halfAM:'Morning half day',halfPM:'Night half day',sick:'Sick leave',unpaid:'Unpaid leave',work:'Work day'};
const TYPE_ORDER=Object.keys(TYPE_LABEL).sort((a,b)=>TYPE_LABEL[a].localeCompare(TYPE_LABEL[b]));

function tags(rec,c){
  const t=[];
  if(c.kind==='workday'&&c.type!=='work')t.push(['info',TYPE_LABEL[c.type]]);
  if(c.late)t.push(['bad','Late '+fm(c.late)]);
  if(c.early)t.push(['bad','Early '+fm(c.early)]);
  if(c.perm)t.push(['info','Permission '+fm(c.perm)]);
  if(c.tripMin)t.push(['info','Trip '+fm(c.tripMin)]);
  if(c.ot)t.push(['ok','Overtime '+c.ot+'h']);
  if(c.credit)t.push(['ok','+1 leave day']);
  if(c.noOut)t.push(['warn','No clock-out']);
  if(c.incomplete)t.push(['warn','Incomplete']);
  if(!t.length&&(rec.in||rec.out))t.push(['mute',(rec.in||'?')+' – '+(rec.out||'?')]);
  return t.map(x=>'<span class="tag '+x[0]+'">'+esc(x[1])+'</span>').join('');
}

/* ================= statistics ================= */
function monthStats(ym){
  const p=ym.split('-'),y=+p[0],m=+p[1]-1,n=new Date(y,m+1,0).getDate(),now=todayStr();
  const st={late:0,early:0,perm:0,lateDays:0,earlyDays:0,otWork:0,otWeekend:0,otHoliday:0,credit:0,annual:0,casual:0,half:0,sick:0,unpaid:0,trips:0,missing:[],rows:[]};
  for(let i=1;i<=n;i++){
    const d=y+'-'+pad(m+1)+'-'+pad(i),rec=S.days[d],kind=kindOf(d);let c=null;
    if(rec){
      c=calc(rec);
      st.late+=c.late;st.early+=c.early;st.perm+=c.perm;st.trips+=c.tripMin;
      if(c.late)st.lateDays++;if(c.early)st.earlyDays++;
      if(kind==='workday')st.otWork+=c.ot;else if(kind==='weekend')st.otWeekend+=c.ot;else st.otHoliday+=c.ot;
      st.credit+=c.credit;st.annual+=c.leave.annual;st.casual+=c.leave.casual;st.sick+=c.leave.sick;st.unpaid+=c.leave.unpaid;st.half+=c.leave.half;
    }else if(kind==='workday'&&d<now)st.missing.push(d);
    st.rows.push({d:d,rec:rec,c:c,kind:kind});
  }
  st.used=st.late+st.early+st.perm;st.free=Math.round(S.settings.permHours*60);
  st.deduct=Math.max(0,st.used-st.free);st.left=Math.max(0,st.free-st.used);
  st.ot=st.otWork+st.otWeekend+st.otHoliday;
  return st;
}
function yearStats(y){
  const s={annualUsed:0,casualUsed:0,halfDays:0,sickUsed:0,unpaid:0,credits:0};
  Object.keys(S.days).forEach(d=>{
    if(d.indexOf(y+'-')!==0)return;
    const c=calc(S.days[d]);
    s.annualUsed+=c.leave.annual;s.casualUsed+=c.leave.casual;s.halfDays+=c.leave.half;
    s.sickUsed+=c.leave.sick;s.unpaid+=c.leave.unpaid;s.credits+=c.credit;
  });
  s.allowance=S.settings.annual+s.credits;
  s.totalUsed=s.annualUsed+s.casualUsed+s.halfDays*0.5;
  s.left=s.allowance-s.totalUsed;
  s.casualLeft=S.settings.casual-s.casualUsed;
  s.sickLeft=S.settings.sick-s.sickUsed;
  return s;
}

/* ================= ui plumbing ================= */
let view='home';
const now0=new Date();
const ui={month:now0.getFullYear()+'-'+pad(now0.getMonth()+1),year:now0.getFullYear(),ltype:'all',ptype:'all',stab:'holidays'};
let toastT,resolver=null,draft=null,exportData={};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show');$('#sheet').innerHTML='';draft=null;resolver=null}
function ask(msg,ok){return new Promise(res=>{
  openModal('<h3>'+esc(msg)+'</h3><div class="btns"><button class="btn ghost" data-a="ask-no">Cancel</button><button class="btn danger" data-a="ask-yes">'+esc(ok||'Confirm')+'</button></div>');
  resolver=res;
})}
function go(v){view=v;try{history.pushState({v:v},'')}catch(e){}render();window.scrollTo(0,0)}
const monthPicker=()=>'<div class="filters one"><label>Month<input type="month" id="mp" value="'+ui.month+'"></label></div>';
const sel=(id,opts,cur)=>'<select id="'+id+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
const sortOpts=a=>a.slice().sort((x,y)=>x[1].localeCompare(y[1]));

/* ================= views ================= */
const TITLES={home:'Attendance & Leave',log:'Daily Log',leaves:'Leaves',perm:'Permissions & Trips',ot:'Overtime',report:'Monthly Report',pay:'Payslips',setup:'Holidays & Schedules',settings:'Settings'};

function vHome(){
  const d=todayStr(),rec=S.days[d],kind=kindOf(d),sch=schedule(d),c=rec?calc(rec):null;
  const ms=monthStats(d.slice(0,7)),ys=yearStats(+d.slice(0,4));
  let info;
  if(kind==='weekend')info='Weekend — whole hours worked count as overtime';
  else if(kind==='holiday')info=esc(holidayOf(d).name||'Holiday')+' — whole hours worked count as overtime';
  else info='Expected '+sch.start+' – '+sch.end+(sch.name?' · '+esc(sch.name):'');
  let h='<section class="card center"><div class="muted">'+esc(dayLong(d))+'</div><div class="muted small" style="margin-top:2px">'+info+'</div>';
  const leaveToday=rec&&kind==='workday'&&['annual','casual','sick','unpaid'].includes(rec.type);
  if(leaveToday){
    h+='<div class="timer" style="font-size:26px;margin:14px 0">'+esc(TYPE_LABEL[rec.type])+' today</div>';
  }else if(!rec||!rec.in){
    h+='<div class="timer" style="font-size:30px;color:var(--muted);margin:12px 0">Not clocked in</div><button class="btn big" data-a="in">Clock in</button>';
  }else if(!rec.out){
    h+='<div class="timer" id="timer">00:00:00</div><div class="muted">Clocked in at '+rec.in+'</div><button class="btn big danger" style="margin-top:12px" data-a="out">Clock out</button>';
  }else{
    h+='<div class="timer" style="font-size:28px;margin:12px 0">'+rec.in+' – '+rec.out+'</div>';
  }
  if(c){const t=tags(rec,c);if(t)h+='<div style="margin-top:10px">'+t+'</div>'}
  h+='<div style="margin-top:6px"><button class="link" data-a="editday" data-d="'+d+'">Edit today</button></div></section>';
  h+='<div class="stats">'+
    '<div class="stat"><b>'+fd(ys.left)+'</b><span>Annual days left</span></div>'+
    '<div class="stat"><b>'+fd(ys.casualLeft)+'</b><span>Casual days left</span></div>'+
    '<div class="stat"><b>'+fd(ys.sickLeft)+'</b><span>Sick days left</span></div>'+
    '<div class="stat"><b>'+fm(ms.left)+'</b><span>Permission left this month</span></div></div>';
  h+='<div class="menu">'+
    menuBtn('log','🗓','Daily Log')+menuBtn('leaves','🌴','Leaves')+menuBtn('perm','⏱','Permissions & Trips')+
    menuBtn('ot','➕','Overtime')+menuBtn('report','📊','Monthly Report')+menuBtn('pay','💵','Payslips')+menuBtn('setup','📅','Holidays & Schedules')+menuBtn('settings','⚙️','Settings')+'</div>';
  return h;
}
const menuBtn=(v,ic,l)=>'<button data-go="'+v+'"><span class="ic">'+ic+'</span>'+l+'<span class="go">›</span></button>';

function vLog(){
  const st=monthStats(ui.month),now=todayStr();
  let h=monthPicker()+'<section class="card" style="padding:6px 16px">';
  st.rows.forEach(r=>{
    const isToday=r.d===now;
    if(r.kind!=='workday'&&!r.rec){
      const lab=r.kind==='weekend'?'Weekend':esc(holidayOf(r.d).name||'Holiday');
      h+='<button class="row off" data-a="editday" data-d="'+r.d+'"><span class="d">'+dayShort(r.d)+'</span><span class="muted small">'+lab+'</span></button>';
      return;
    }
    let right=r.rec?tags(r.rec,r.c):(r.d<now?'<span class="tag warn">No record</span>':'<span class="tag mute">—</span>');

function render(){

function tick(){
  const t=$('#timer');if(!t)return;
  const rec=S.days[todayStr()];if(!rec||!rec.in||rec.out)return;
  const n=new Date(),a=tm(rec.in),b=n.getHours()*60+n.getMinutes();
  let sec=(b-a)*60+n.getSeconds();if(sec<0)sec=0;
  t.textContent=pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec/60)%60)+':'+pad(sec%60);
}
setInterval(tick,500);

/* ================= clock in / out ================= */
function blank(d){return {date:d,type:'work',in:'',out:'',perms:[],trips:[],holidayMode:'ot',note:''}}
function clockIn(){
  const d=todayStr();let rec=S.days[d];
  if(!rec)rec=S.days[d]=blank(d);
  rec.in=hm(new Date());rec.out='';
  save();render();toast('Clocked in at '+rec.in);
}
function clockOut(){
  const d=todayStr(),rec=S.days[d];if(!rec||!rec.in)return;
  rec.out=hm(new Date());
  save();render();
  const c=calc(rec),bits=[];
  if(c.late)bits.push('late '+fm(c.late));if(c.early)bits.push('early '+fm(c.early));if(c.ot)bits.push('overtime '+c.ot+'h');
  toast('Clocked out at '+rec.out+(bits.length?' · '+bits.join(', '):''));
}

/* ================= day editor ================= */
function openDay(date,opts){
  const ex=S.days[date];
  draft=ex?JSON.parse(JSON.stringify(ex)):blank(date);
  draft.perms=draft.perms||[];draft.trips=draft.trips||[];
  draft._new=!ex;draft._orig=date;
  if(opts&&opts.type&&draft._new)draft.type=opts.type;
  if(opts&&opts.perm)draft.perms.push({from:'',to:''});
  if(opts&&opts.trip)draft.trips.push({from:'',to:''});
  renderDay();
}
function clean(d){
  return {date:d.date,type:d.type,in:d.in||'',out:d.out||'',perms:d.perms.filter(x=>x.from||x.to),trips:d.trips.filter(x=>x.from||x.to),holidayMode:d.holidayMode||'ot',note:(d.note||'').trim()};
}
function listBlock(key,title){
  const l=draft[key];
  let h='<div class="sub"><h4>'+title+'</h4><button class="link" data-a="addrow" data-key="'+key+'">+ Add</button></div>';
  l.forEach((x,i)=>{
    h+='<div class="two" style="align-items:end"><label>From<input type="time" data-list="'+key+'" data-i="'+i+'" data-f="from" value="'+esc(x.from)+'"></label>'+
       '<label>To<div style="display:flex;gap:6px"><input type="time" data-list="'+key+'" data-i="'+i+'" data-f="to" value="'+esc(x.to)+'"><button class="link" data-a="delrow" data-key="'+key+'" data-i="'+i+'" aria-label="Remove">✕</button></div></label></div>';
  });
  return h;
}
function renderDay(){
  const d=draft,kind=kindOf(d.date),workday=kind==='workday';
  const leave=workday&&['annual','casual','sick','unpaid'].includes(d.type);
  let h='<h3>'+(d._new?'Add day':'Edit day')+'</h3><label style="margin-top:0">Date<input type="date" id="d-date" value="'+d.date+'"></label>';
  const kl=kind==='weekend'?'Weekend':kind==='holiday'?esc(holidayOf(d.date).name||'Holiday'):'Workday';
  h+='<div class="muted small" style="margin-top:6px">'+esc(dayLong(d.date))+' · '+kl+'</div>';
  if(workday){
    h+='<label>Day type<select id="d-type">'+TYPE_ORDER.map(k=>'<option value="'+k+'"'+(k===d.type?' selected':'')+'>'+TYPE_LABEL[k]+'</option>').join('')+'</select></label>';
    if(d.type==='halfAM')h+='<div class="muted small" style="margin-top:6px">Expected to arrive by 1:00 PM</div>';
    if(d.type==='halfPM')h+='<div class="muted small" style="margin-top:6px">Expected to stay until 1:00 PM</div>';
  }
  if(!leave){
    h+='<div class="two"><label>Clock in<input type="time" data-k="in" value="'+esc(d.in)+'"></label><label>Clock out<input type="time" data-k="out" value="'+esc(d.out)+'"></label></div>';
    if(workday){h+=listBlock('perms','Permissions')+listBlock('trips','Business trips')}
    if(kind==='holiday')h+='<label>If you worked this holiday, count it as<select data-k="holidayMode"><option value="leave"'+(d.holidayMode==='leave'?' selected':'')+'>+1 annual leave day</option><option value="ot"'+(d.holidayMode!=='leave'?' selected':'')+'>Overtime</option></select></label>';
  }
  h+='<label>Note<input data-k="note" maxlength="80" value="'+esc(d.note||'')+'"></label><div class="prev" id="dprev"></div>'+
     '<div class="btns"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="saveday">Save</button></div>'+
     (d._new?'':'<div class="btns"><button class="btn danger" data-a="delday">Delete this day</button></div>');
  openModal(h);previewDay();
}
function previewDay(){
  const p=$('#dprev');if(!p||!draft)return;
  const c=calc(clean(draft)),L=[];
  if(c.kind==='workday'){
    if(['annual','casual','sick','unpaid'].includes(draft.type))L.push(TYPE_LABEL[draft.type]+' — 1 day');
    else{
      if(draft.type==='halfAM'||draft.type==='halfPM')L.push('Half day — 0.5 annual day');
      L.push('Late: '+(c.late?fm(c.late)+' (actual '+fm(c.lateRaw)+')':'none'));
      L.push('Early leaving: '+(c.early?fm(c.early)+' (actual '+fm(c.earlyRaw)+')':'none'));
      if(c.perm)L.push('Permission: '+fm(c.perm));
      if(c.tripMin)L.push('Business trip: '+fm(c.tripMin));
      L.push('Overtime: '+(c.ot?c.ot+'h':'none'));
    }
  }else{
    L.push(c.credit?'Holiday converted to +1 annual leave day':'Overtime: '+(c.ot?c.ot+'h ('+fm(c.otMin)+' worked)':'none'));
  }
  if(c.noOut)L.push('No clock-out yet');
  p.innerHTML=L.map(esc).join('<br>');
}
function saveDay(){
  const d=clean(draft),kind=kindOf(d.date);
  if(!d.date){toast('Choose a date');return}
  const leave=kind==='workday'&&['annual','casual','sick','unpaid'].includes(d.type);
  if(leave){d.in='';d.out='';d.perms=[];d.trips=[]}
  if(!leave){
    if(d.in&&!TIME.test(d.in)||d.out&&!TIME.test(d.out)){toast('Check the times');return}
    if(kind==='workday'&&d.in&&d.out&&tm(d.out)<=tm(d.in)){toast('Clock-out must be after clock-in');return}
    if(!d.in&&d.out){toast('Add a clock-in time');return}
    for(const k of ['perms','trips']){
      for(const x of d[k]){
        if(!TIME.test(x.from)||!TIME.test(x.to)||tm(x.to)<=tm(x.from)){toast('Check the '+(k==='perms'?'permission':'trip')+' times');return}
      }
    }
    if(kind!=='workday'){d.type='work';d.perms=[];d.trips=[]}
  }
  if(draft._orig!==d.date)delete S.days[draft._orig];
  S.days[d.date]=d;
  ui.month=d.date.slice(0,7);
  save();closeModal();render();toast('Saved');
}

const csvCell=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCsv(dates){
  const rows=[['Date','Day','Type','Clock in','Clock out','Late (min)','Early (min)','Permission (min)','Trip (min)','Overtime (h)','Holiday credit','Note']];
  dates.sort().forEach(d=>{
    const rec=S.days[d],c=calc(rec);
    rows.push([d,c.kind,c.kind==='workday'?TYPE_LABEL[c.type]:'Work',rec.in,rec.out,c.late,c.early,c.perm,c.tripMin,c.ot,c.credit,rec.note||'']);
  });
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
function showExport(title,text,name,mime){
  exportData={text:text,name:name,mime:mime};
  openModal('<h3>'+esc(title)+'</h3><textarea id="exp" readonly>'+esc(text)+'</textarea><div class="btns"><button class="btn" data-a="copy">Copy</button>'+
    (navigator.share?'<button class="btn ghost" data-a="share">Share</button>':'')+'<button class="btn ghost" data-a="dl">Download</button></div><div class="btns"><button class="btn ghost" data-a="close">Close</button></div>');
}
function copyText(){
  const text=exportData.text,fb=()=>{const ta=$('#exp');ta.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy it')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copied'),fb);else fb();
}
function download(){
  if(window.Android&&typeof window.Android.saveFile==='function'){
    try{const r=window.Android.saveFile(exportData.name,exportData.text);toast(r?'Saved to '+r+' as '+exportData.name:'Could not save — use Copy');return}catch(e){}
  }
  try{const b=new Blob(['\ufeff'+exportData.text],{type:exportData.mime}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=exportData.name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Download started')}
  catch(e){toast('Download not available — use Copy')}
}
function doImport(){
  let p;try{p=JSON.parse($('#imp').value.trim())}catch(e){toast('Not a valid backup');return}
  if(!p||!p.days||typeof p.days!=='object'){toast('Not a valid backup');return}
  const d=defaults();d.days=p.days;
  if(Array.isArray(p.periods))d.periods=p.periods;if(Array.isArray(p.holidays))d.holidays=p.holidays;
  if(Array.isArray(p.payslips))d.payslips=p.payslips;
  if(p.settings)Object.keys(d.settings).forEach(k=>{if(p.settings[k]!==undefined)d.settings[k]=p.settings[k]});
  S=d;save();closeModal();render();toast('Restored '+Object.keys(S.days).length+' days');
}
function setSetting(k,v){
  const s=S.settings;
  if(k==='start'||k==='end'){if(!TIME.test(v))return;s[k]=v}
  else{const n=parseFloat(v);if(isNaN(n)||n<0)return;s[k]=n}
  save();toast('Saved');
}

/* ================= payslips ================= */
const normAr=s=>String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const cellText=td=>td.textContent.replace(/ /g,' ').replace(/\s+/g,' ').trim();
function num(s){
  const t=String(s||'').replace(/,/g,'').trim();
  if(/^-?\d+(\.\d+)?$/.test(t))return parseFloat(t);
  const m=t.match(/^(\d+(?:\.\d+)?)-$/);
  return m?-parseFloat(m[1]):null;
}
const m2=n=>(n==null?0:n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const EN_RAW={
  'المرتب الأساسي':'Basic salary','علاوة السنة الحالية':'Current-year raise','علاوة سنوات سابقة':'Previous-years raise',
  'حوافز و مكافآت':'Incentives & bonuses','بدلات':'Allowances','أضافي':'Overtime','تسويات أخرى':'Other adjustments',
  'عمولات':'Commissions','م. توزيع أرباح':'Profit distribution','تسوية رصيد اجازات':'Leave balance adjustment',
  'تأمينات':'Social insurance','ت.معاش اضافى':'Extra pension','ضريبة كسب العمل':'Income tax','أجازة مرضية':'Sick leave',
  'غياب':'Absence','أيام بدون أجر':'Unpaid days','تسوية ضريبية':'Tax settlement','تأمين صحى شامل':'Universal health insurance',
  'م. بالرعاية الصحية':'Healthcare contribution','م. بصندوق العاملين':'Employees fund contribution','مساهمه تكافليه':'Takaful contribution',
  'قسط شراء مدة':'Service-period purchase installment','مشاركة مجتمعية':'Community participation',
  'تسوية دفعة مقدمة مكافآت':'Advance settlement – bonuses','تسوية دفعة مقدمة عمولات':'Advance settlement – commissions',
  'تأمين سيارة':'Car insurance','استقطاعات مزايا عاملين':'Employee benefit deductions','إنتقالات':'Transport','قسط بنك':'Bank installment',
  'عهد مؤقتة':'Temporary custody','فاتورة محمول':'Mobile bill','إصلاح سيارة':'Car repair','تسويات أخري':'Other adjustments','مصروفات':'Expenses'
};
const EN={};Object.keys(EN_RAW).forEach(k=>{EN[normAr(k)]=EN_RAW[k]});
const labelHtml=l=>{const en=EN[normAr(l)];return en?esc(en)+'<div class="muted small" dir="auto">'+esc(l)+'</div>':'<span dir="auto">'+esc(l)+'</span>'};
const isOT=l=>{const n=normAr(l);return n.indexOf('اضاف')>=0&&n.indexOf('علاو')<0};
const isAbs=l=>normAr(l).indexOf('غياب')>=0;
const isUnpaid=l=>normAr(l).indexOf('بدون اجر')>=0;
const isSickL=l=>normAr(l).indexOf('مرضي')>=0;
const isBasic=l=>normAr(l).indexOf('المرتب الاساسي')>=0;
const sumBy=(items,fn)=>items.filter(x=>fn(x.label)).reduce((a,x)=>a+x.amount,0);
const prevMonth=ym=>{const p=ym.split('-'),d=new Date(+p[0],+p[1]-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};

/* Reads the company's "Employee Remuneration statement" HTML. Nothing leaves the phone. */
function parsePayslip(html){
  let doc;try{doc=new DOMParser().parseFromString(html,'text/html')}catch(e){return null}
  const all=(doc.body?doc.body.textContent:'').replace(/ /g,' ');
  const mm=all.match(/for\s*:\s*(\d{1,2})\s*\/\s*(\d{4})/i);
  if(!mm)return null;
  const mo=+mm[1];if(mo<1||mo>12)return null;
  const p={month:mm[2]+'-'+pad(mo),earn:[],ded:[],orders:[],totEarn:null,totDed:null,netIncome:null,net:null,ordersTotal:null,ok:true};
  let after=false;
  Array.prototype.forEach.call(doc.querySelectorAll('tr'),tr=>{
    const c=Array.prototype.map.call(tr.children,cellText);
    if(!c.length)return;
    if(/^net\s*:/i.test(c[0])){p.net=num(c[0].replace(/^net\s*:/i,''));after=true;return}
    if(!after){
      if(c.length>=4){
        const dl=c[1],dv=num(c[0]),el=c[3],ev=num(c[2]);
        if(normAr(dl).indexOf('اجمالي')>=0||normAr(el).indexOf('اجمالي')>=0){
          if(dv!==null)p.totDed=dv;if(ev!==null)p.totEarn=ev;return;
        }
        if(dl&&dv!==null)p.ded.push({label:dl,amount:dv});
        if(el&&ev!==null)p.earn.push({label:el,amount:ev});
      }else if(c.length===2&&num(c[0])!==null&&normAr(c[1]).indexOf('صافي')>=0){p.netIncome=num(c[0])}
    }else if(c.length===2){
      const v=num(c[0]),l=c[1];if(!l)return;
      if(normAr(l).indexOf('اجمالي')>=0){if(v!==null)p.ordersTotal=v;return}
      if(v!==null)p.orders.push({label:l,amount:v});
    }
  });
  if(!p.earn.length&&!p.ded.length)return null;
  const se=p.earn.reduce((a,x)=>a+x.amount,0),sd=p.ded.reduce((a,x)=>a+x.amount,0);
  p.ok=(p.totEarn===null||Math.abs(se-p.totEarn)<0.015)&&(p.totDed===null||Math.abs(sd-p.totDed)<0.015);
  return p;
}
function importPayslips(files){
  const list=Array.prototype.slice.call(files||[]);if(!list.length)return;
  let done=0,good=0,last=null;
  list.forEach(f=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const p=parsePayslip(String(fr.result||''));
      if(p){S.payslips=S.payslips.filter(x=>x.month!==p.month).concat(p);good++;last=p.month}
      if(++done===list.length)finish();
    };
    fr.onerror=()=>{if(++done===list.length)finish()};
    fr.readAsText(f,'utf-8');
  });
  function finish(){
    save();render();
    if(!good){toast('Could not read that file as a payslip');return}
    toast('Imported '+good+' payslip'+(good>1?'s':'')+(good<list.length?' ('+(list.length-good)+' not recognised)':''));
    if(good===1&&last)payDetail(last);
  }
}
function vPay(){
  let h='<label class="btn full" style="text-align:center;margin:0">Import payslip<input type="file" id="payfile" accept=".htm,.html,text/html" multiple hidden></label>'+
    '<div class="muted small center" style="margin:8px 0 14px">Choose the payslip .htm file. It is read on this phone only.</div>';
  const list=S.payslips.slice().sort((a,b)=>a.month<b.month?1:-1);
  h+='<section class="card" style="padding:6px 16px">';
  if(!list.length)h+='<div class="empty">No payslips imported yet.</div>';
  list.forEach(p=>{
    const ot=sumBy(p.earn,isOT),dd=sumBy(p.ded,isAbs)+sumBy(p.ded,isUnpaid)+sumBy(p.ded,isSickL);
    h+='<button class="row" data-a="payopen" data-m="'+p.month+'"><span><b>'+esc(monthTitle(p.month))+'</b><div class="muted small">Net '+m2(p.net!=null?p.net:p.netIncome)+'</div></span><span class="r">'+
      (ot?'<span class="tag ok">Overtime '+m2(ot)+'</span>':'')+(dd?'<span class="tag bad">Deducted '+m2(dd)+'</span>':'')+'</span></button>';
  });
  return h+'</section>';
}
function payLines(items){
  const v=items.filter(x=>x.amount!==0);
  if(!v.length)return '<div class="muted small">None</div>';
  return v.map(x=>'<div class="line"><span>'+labelHtml(x.label)+'</span><b>'+m2(x.amount)+'</b></div>').join('');
}
function verdict(paid,app){
  if(paid>0&&app)return ['info','Both show it'];
  if(paid>0&&!app)return ['warn','Payslip only'];
  if(!paid&&app)return ['warn','App only'];
  return ['ok','None on both'];
}
const vTag=v=>'<span class="tag '+v[0]+'">'+v[1]+'</span>';
function payCompare(p){
  const pm=prevMonth(p.month),st=monthStats(pm),title=monthTitle(pm);
  let h='<h4 style="margin-top:18px">Check against '+esc(title)+'</h4>';
  if(!st.rows.some(r=>r.rec))return h+'<div class="muted small">No attendance was recorded in the app for '+esc(title)+', so there is nothing to compare.</div>';
  const otPaid=sumBy(p.earn,isOT),hrs=st.ot;
  const v1=verdict(otPaid,hrs>0);
  h+='<div class="line" style="padding-bottom:0"><b>Overtime</b>'+vTag(v1)+'</div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">Payslip paid</span><span>'+m2(otPaid)+'</span></div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">App counted</span><span>'+hrs+'h (weekdays '+st.otWork+', weekends '+st.otWeekend+', holidays '+st.otHoliday+')</span></div>'+
    (otPaid>0&&hrs>0?'<div class="line" style="padding:2px 0"><span class="muted small">Average paid per hour</span><span>'+m2(otPaid/hrs)+'</span></div>':'');
  const abs=sumBy(p.ded,isAbs),unp=sumBy(p.ded,isUnpaid),sick=sumBy(p.ded,isSickL);
  const appDed=st.unpaid>0||st.deduct>0||st.missing.length>0;
  const v2=verdict(abs+unp,appDed);
  h+='<div class="line" style="padding-bottom:0;margin-top:10px"><b>Absence &amp; unpaid deductions</b>'+vTag(v2)+'</div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">Payslip deducted</span><span>Absence '+m2(abs)+' · Unpaid days '+m2(unp)+'</span></div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">App shows</span><span>Unpaid '+fd(st.unpaid)+' day(s) · Late/early over pool '+fm(st.deduct)+' · No record '+st.missing.length+' day(s)</span></div>';
  const basic=sumBy(p.earn,isBasic);
  if(unp>0&&st.unpaid>0)h+='<div class="line" style="padding:2px 0"><span class="muted small">Deducted per unpaid day</span><span>'+m2(unp/st.unpaid)+(basic?' (basic ÷ 30 = '+m2(basic/30)+')':'')+'</span></div>';
  if(sick>0||st.sick>0){
    h+='<div class="line" style="padding:2px 0;margin-top:8px"><span class="muted small">Sick leave</span><span>Payslip deducted '+m2(sick)+' · app '+fd(st.sick)+' day(s)</span></div>';
  }
  return h;
}
function payDetail(month){
  const p=S.payslips.find(x=>x.month===month);if(!p)return;
  let h='<h3>Payslip – '+esc(monthTitle(p.month))+'</h3>';
  if(!p.ok)h+='<div class="prev" style="background:var(--warn-soft);color:var(--warn);margin:0 0 12px">The lines do not add up to the printed totals — check the file.</div>';
  h+='<div class="line"><span>Total earnings</span><b>'+m2(p.totEarn)+'</b></div>'+
    '<div class="line"><span>Total deductions</span><b>'+m2(p.totDed)+'</b></div>'+
    '<div class="line t"><span><b>Net income</b></span><b>'+m2(p.netIncome)+'</b></div>'+
    (p.net!=null&&p.net!==p.netIncome?'<div class="line"><span>After transfers &amp; payment notes</span><b>'+m2(p.net)+'</b></div>':'')+
    '<h4 style="margin-top:18px">Earnings</h4>'+payLines(p.earn)+
    '<h4 style="margin-top:18px">Deductions</h4>'+payLines(p.ded);
  if(p.orders.some(x=>x.amount!==0))h+='<h4 style="margin-top:18px">Payment notes</h4>'+payLines(p.orders);
  h+=payCompare(p)+
    '<div class="btns"><button class="btn ghost" data-a="close">Close</button></div>'+
    '<div class="btns"><button class="btn danger" data-a="paydel" data-m="'+p.month+'">Remove this payslip</button></div>';
  openModal(h);
}

/* ================= events ================= */
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(ev.target.id==='back'){view='home';render();window.scrollTo(0,0);return}
  if(ev.target.id==='act'){openDay(todayStr());return}
  if(ev.target.id==='modal'){closeModal();return}
  const t=ev.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id;
  switch(a){
    case 'in':clockIn();break;
    case 'out':clockOut();break;
    case 'editday':openDay(t.dataset.d);break;
    case 'addleave':openDay(todayStr(),{type:['annual','casual','sick','unpaid','halfAM','halfPM'].includes(ui.ltype)?ui.ltype:'annual'});break;
    case 'close':closeModal();break;
    case 'saveday':saveDay();break;
    case 'addrow':draft[t.dataset.key].push({from:'',to:''});renderDay();break;
    case 'delrow':draft[t.dataset.key].splice(+t.dataset.i,1);renderDay();break;
    case 'delday':{const d=draft._orig;ask('Delete the record for '+dayShort(d)+'?','Delete').then(ok=>{if(ok){delete S.days[d];save();closeModal();render();toast('Deleted')}});break}
    case 'ask-yes':{const r=resolver;resolver=null;closeModal();if(r)r(true);break}
    case 'ask-no':{const r=resolver;resolver=null;closeModal();if(r)r(false);break}
    case 'payopen':payDetail(t.dataset.m);break;
    case 'paydel':{const m=t.dataset.m;ask('Remove the '+monthTitle(m)+' payslip from this phone?','Remove').then(ok=>{if(ok){S.payslips=S.payslips.filter(x=>x.month!==m);save();closeModal();render();toast('Removed')}});break}
    case 'addhol':holForm(null);break;
    case 'edithol':holForm(id);break;
    case 'savehol':saveHol(id);break;
    case 'delhol':S.holidays=S.holidays.filter(h=>h.id!==id);save();closeModal();render();toast('Deleted');break;
    case 'addper':perForm(null);break;
    case 'editper':perForm(id);break;
    case 'saveper':savePer(id);break;
    case 'delper':S.periods=S.periods.filter(h=>h.id!==id);save();closeModal();render();toast('Deleted');break;
    case 'csv':{const pre=ui.month+'-';showExport('CSV – '+monthTitle(ui.month),toCsv(Object.keys(S.days).filter(d=>d.indexOf(pre)===0)),'attendance-'+ui.month+'.csv','text/csv');break}
    case 'csvall':showExport('CSV – all days',toCsv(Object.keys(S.days)),'attendance-all.csv','text/csv');break;
    case 'backup':showExport('Backup',JSON.stringify({app:'attendance',version:1,days:S.days,periods:S.periods,holidays:S.holidays,payslips:S.payslips,settings:S.settings}),'attendance-backup.json','application/json');break;
    case 'restore':openModal('<h3>Restore backup</h3><div class="muted small">Paste your backup text. This replaces all current data.</div><textarea id="imp" placeholder="Paste backup here"></textarea><div class="btns"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="doimport">Restore</button></div>');break;
    case 'doimport':doImport();break;
    case 'copy':copyText();break;
    case 'dl':download();break;
    case 'share':navigator.share({title:exportData.name,text:exportData.text}).catch(()=>{});break;
    case 'wipe':ask('Erase ALL data? This cannot be undone.','Erase everything').then(ok=>{if(ok){S=defaults();save();render();toast('All data erased')}});break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='payfile'){const f=t.files;importPayslips(f);t.value='';return}
  if(t.id==='mp'){if(t.value){ui.month=t.value;render()}return}
  if(t.id==='ly'){ui.year=+t.value;render();return}
  if(t.id==='lt'){ui.ltype=t.value;render();return}
  if(t.id==='pt'){ui.ptype=t.value;render();return}
  if(t.id==='st'){ui.stab=t.value;render();return}
  if(t.dataset.set){setSetting(t.dataset.set,t.value);return}
  if(t.dataset.wd!==undefined){
    const i=+t.dataset.wd,w=S.settings.workDays.filter(x=>x!==i);
    if(t.checked)w.push(i);S.settings.workDays=w.sort();save();toast('Saved');return;
  }
  if(!draft)return;
  if(t.id==='d-date'){
    const nd=t.value;if(!nd)return;
    if(nd!==draft._orig&&S.days[nd]){const keep=nd;closeModal();openDay(keep);toast('That day already has a record — opened it');return}
    draft.date=nd;renderDay();return;
  }
  if(t.id==='d-type'){draft.type=t.value;renderDay()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!draft||!$('#sheet').contains(t))return;
  if(t.dataset.k)draft[t.dataset.k]=t.value;
  else if(t.dataset.list)draft[t.dataset.list][+t.dataset.i][t.dataset.f]=t.value;
  else return;
  previewDay();
});
window.addEventListener('popstate',()=>{if(view!=='home'){view='home';render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!draft&&$('#modal').classList.contains('show')===false)render()});

window.__app={parsePayslip:parsePayslip,payCompare:payCompare,calc:calc,kindOf:kindOf,monthStats:monthStats,yearStats:yearStats,get:()=>S,set:o=>{S=o;save();render()}};
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
