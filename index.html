<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1f4f9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Attendance &amp; Leave</title>
<style>
:root{
  --bg:#f1f4f9;--card:#fff;--text:#0a1a33;--muted:#55647c;--line:#e0e6ef;
  --accent:#0d3b8c;--on-accent:#fff;--soft:#dce7f8;--danger:#dc2626;--on-danger:#fff;--danger-soft:#fee2e2;
  --warn:#b45309;--warn-soft:#fef3c7;--ok:#15803d;--ok-soft:#dcfce7;--info:#1d4ed8;--info-soft:#dbeafe;
  --danger-fg:#b91c1c;--dot:#2f7cf6;--pill-shadow:0 10px 22px rgba(10,26,51,.16),0 3px 7px rgba(10,26,51,.10),inset 0 1px 0 rgba(255,255,255,.9);--pill-on-shadow:0 4px 10px rgba(10,26,51,.35);--hdr-bg:#0d3b8c;--hdr-fg:#fff;--toast-bg:#0a1a33;--toast-fg:#fff;--outline:#76849a;color-scheme:light;
  --shadow:0 1px 2px rgba(10,26,51,.05),0 4px 14px rgba(10,26,51,.05)}
:root[data-theme=dark]{--bg:#071226;--card:#0f1c33;--text:#e6edf8;--muted:#9babc4;--line:#213153;--accent:#8db8ff;--on-accent:#04122b;--soft:#16305c;--danger:#f87171;--on-danger:#2a0a0a;--danger-soft:#3b1717;--warn:#fbbf24;--warn-soft:#3a2d0b;--ok:#4ade80;--ok-soft:#10301c;--info:#93c5fd;--info-soft:#16284a;--shadow:none;--danger-fg:#f87171;--dot:#5aa0ff;--pill-shadow:0 12px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);--pill-on-shadow:0 4px 12px rgba(0,0,0,.55);--hdr-bg:#0e3b37;--hdr-fg:#e0fbf7;--toast-bg:#e6edf8;--toast-fg:#071226;--outline:#8796ad;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#071226;--card:#0f1c33;--text:#e6edf8;--muted:#9babc4;--line:#213153;--accent:#8db8ff;--on-accent:#04122b;--soft:#16305c;--danger:#f87171;--on-danger:#2a0a0a;--danger-soft:#3b1717;--warn:#fbbf24;--warn-soft:#3a2d0b;--ok:#4ade80;--ok-soft:#10301c;--info:#93c5fd;--info-soft:#16284a;--shadow:none;--danger-fg:#f87171;--dot:#5aa0ff;--pill-shadow:0 12px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);--pill-on-shadow:0 4px 12px rgba(0,0,0,.55);--hdr-bg:#0e3b37;--hdr-fg:#e0fbf7;--toast-bg:#e6edf8;--toast-fg:#071226;--outline:#8796ad;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;min-height:72px}
header h1 .dot{color:var(--dot)}
header h1{flex:1;margin:0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.6px;color:var(--text)}
header button{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--text);width:50px;height:50px;border-radius:17px;font-size:22px;cursor:pointer;flex:0 0 auto}
header button.hide{display:none}
main{max-width:620px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));touch-action:pan-y;overflow-x:hidden}
#view.anim-l{animation:pgL .32s cubic-bezier(.2,.8,.2,1)}#view.anim-r{animation:pgR .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pgL{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes pgR{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
#view.snap{transition:transform .22s ease}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:26px;margin:6px 14px 16px;padding:6px;box-shadow:var(--pill-shadow)}
#tabs::-webkit-scrollbar{display:none}
.tab{position:relative;overflow:hidden;flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:11px 18px;border-radius:21px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .28s,color .28s,transform .2s}
.tab:active{transform:scale(.96)}
.tab.on{background:var(--text);color:var(--bg);box-shadow:var(--pill-on-shadow)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
header #gear{margin-left:2px}header #gear.hide{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:13px}
h3{margin:0 0 12px;font-size:18px}
h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 0}
input,select,textarea{width:100%;margin-top:5px;padding:12px 12px;border-radius:8px;border:1px solid var(--outline);
  background:transparent;color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent)}
textarea{min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn,.menu button{position:relative;overflow:hidden}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.big{width:100%;padding:18px;font-size:19px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.btns.col{flex-direction:column}.btns .btn small{display:block;font-weight:500;font-size:12px;opacity:.85;margin-top:2px}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:inherit;
  padding:15px 16px;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.menu button:first-child{border-top:0}
.menu .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.menu .go{margin-left:auto;color:var(--muted);font-size:20px}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.red i{background:var(--danger)}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;
  border-top:1px solid var(--line);padding:11px 0;color:inherit;font:inherit;cursor:pointer}
.row:first-child{border-top:0}
.row.off{padding:8px 0}.row.off .d{color:var(--muted);font-weight:600}
.row .d{font-weight:700;min-width:84px}
.row .r{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.row.today .d{color:var(--accent)}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.bad{background:var(--danger-soft);color:var(--danger-fg)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.info{background:var(--info-soft);color:var(--info)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.mute{background:var(--line);color:var(--text)}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.line.t{border-top:1px solid var(--line);margin-top:4px;padding-top:11px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.filters label{margin:0}
.filters.one{grid-template-columns:1fr}
#modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--toast-bg);color:var(--toast-fg);
  padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.prev{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.sub h4{margin:0}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk label{margin:0;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text)}
.chk input{width:auto;margin:0}
/* Material-style dropdown (outlined field + elevated menu) */
.myear{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.myear b{font-size:20px}
.yb{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px;cursor:pointer;position:relative;overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mcell{position:relative;overflow:hidden;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:16px;padding:15px 0;font:inherit;font-weight:700;cursor:pointer}
.mcell.cur{border-color:var(--accent);color:var(--accent)}
.mcell.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ms{position:relative;margin-top:14px;text-align:left}
.filters .ms{margin-top:0}
.ms-l{position:absolute;left:12px;top:-8px;padding:0 4px;font-size:12px;font-weight:600;color:var(--muted);z-index:1;letter-spacing:.2px;pointer-events:none;transition:color .15s}
main .ms-l{background:var(--bg)}
#sheet .ms-l{background:var(--card)}
.ms-b{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:54px;padding:0 10px 0 16px;border:1px solid var(--outline);border-radius:8px;
  background:transparent;color:var(--text);font:inherit;font-size:16px;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.ms-b:active{background:var(--soft)}
.ms-b.open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ms-b.open+.x,.ms:has(.ms-b.open) .ms-l{color:var(--accent)}
.ms-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-ar{flex:none;color:var(--muted);transition:transform .2s}
.ms-b.open .ms-ar{transform:rotate(180deg);color:var(--accent)}
#msmask{position:fixed;inset:0;z-index:40;background:transparent}
#msmenu{position:fixed;z-index:41;background:var(--card);border-radius:8px;padding:8px 0;overflow-y:auto;transform-origin:top center;
  box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);animation:msIn .14s ease-out}
@keyframes msIn{from{opacity:0;transform:scaleY(.92)}to{opacity:1;transform:none}}
#msmenu .mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:0 16px;border:0;background:none;color:var(--text);
  font:inherit;font-size:16px;text-align:left;cursor:pointer}
#msmenu .mi:active{background:var(--soft)}
#msmenu .mi.sel{background:var(--soft);color:var(--accent);font-weight:600}
.chk label:has(input:checked){background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chkline{display:flex;align-items:center;gap:10px;color:var(--text);font-size:15px;font-weight:600;margin:0 0 6px}
.chkline input{width:auto;margin:0}
/* Round checkboxes (native inputs and the log's selection circles) with a ripple on press */
input[type=checkbox],.cbx{-webkit-appearance:none;appearance:none;position:relative;flex:none;display:inline-block;width:22px;height:22px;margin:0;padding:0;
  border:2px solid var(--outline);border-radius:50%;background:transparent;cursor:pointer;vertical-align:middle;transition:background-color .18s,border-color .18s;
  --rc:rgba(13,59,140,.3)}
@supports (color:color-mix(in srgb,red 50%,blue)){input[type=checkbox],.cbx{--rc:color-mix(in srgb,var(--accent) 34%,transparent)}}
input[type=checkbox]::after,.cbx::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.2,.8,.3,1.5)}
input[type=checkbox]:checked,.cbx.on{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after,.cbx.on::after{transform:rotate(45deg) scale(1)}
input[type=checkbox]:focus{outline:none}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.crip::before{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;animation:crip .5s ease-out}
@keyframes crip{from{box-shadow:0 0 0 0 var(--rc)}to{box-shadow:0 0 0 18px transparent}}
/* Daily log multi-select */
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.selm{position:relative;overflow:hidden;justify-content:flex-start;margin:0 -16px;padding-left:16px;padding-right:16px;width:calc(100% + 32px);transition:background .18s}
.row.selm .r{margin-left:auto}
.row.selm .cbx{animation:cbIn .22s cubic-bezier(.2,.8,.2,1)}
.row.picked{background:var(--soft)}
@keyframes cbIn{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.brkbtn{background:var(--warn-soft);color:var(--warn)}
.brk.on{margin:12px 0 4px;padding:12px;border-radius:14px;background:var(--warn-soft);color:var(--warn)}
.brk.on .muted{color:inherit;opacity:.85}
.btimer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
/* Floating "+ Add" button, bottom right (same as the expenses app) */
.fab{position:fixed;right:max(18px,calc(50vw - 292px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:4;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);
  font:800 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 24px;min-height:58px;cursor:pointer;overflow:hidden;
  box-shadow:0 10px 22px rgba(10,26,51,.28),0 3px 7px rgba(10,26,51,.18);transition:transform .15s,box-shadow .15s;animation:fabIn .28s cubic-bezier(.2,.8,.2,1)}
.fab:active{transform:scale(.96);box-shadow:0 5px 12px rgba(10,26,51,.26),0 2px 4px rgba(10,26,51,.16)}
:root[data-theme=dark] .fab{box-shadow:0 10px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .fab{box-shadow:0 10px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45)}}
@keyframes fabIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
body.fabon main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.selon main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -8px 24px rgba(10,26,51,.14);padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:sbUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sbUp{from{transform:translateY(100%)}to{transform:none}}
#selbar .in{max-width:620px;margin:0 auto}
.sb-top{display:flex;align-items:center;gap:10px}
.sb-x{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--text);font-size:20px;cursor:pointer}
.sb-n{flex:1;font-weight:800;font-size:17px}
.sb-all{display:flex;align-items:center;gap:10px;margin:0;padding:8px 4px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
#selbar .btns{margin-top:8px}

/* ---- CheckBook look (navy family) — shared by every app ---- */
.tab.on,#tabs .tab.on,.mk-tab.on{background:var(--accent)!important;color:var(--on-accent)!important}
.btn.ghost{background:var(--soft);color:var(--accent)}
:root{--rc:rgba(13,59,140,.3)}:root[data-theme=dark]{--rc:rgba(141,184,255,.3)}
</style>
<script id="mk-cfg">window.MKCFG={tabs:'#tabs',tab:'#tabs .tab',overlays:[{sel:'#modal',cls:'show',panel:'#sheet',kind:'sheet'}],
 menus:[{sel:'#msmenu',mask:'#msmask'}],view:'#view',title:'#title',dotSel:'.dot',gear:'#gear',hbtns:'#back',autoDate:true,
 screenKey:()=>(document.getElementById('title')||{}).textContent};</script>
<!-- mkit:start · Mina's shared Material kit (same block in every app; only MKCFG changes) -->

.ic,.mk-ic{color:var(--mk-acc,currentColor);font-size:26px!important;line-height:1!important;text-align:center}
#mupd .ic{font-size:28px!important}
/* ---------- shared tokens (each app maps them to its own variables in MKCFG.vars) ---------- */
:root{--mk-ease:cubic-bezier(.2,.8,.2,1);--mk-pop:0 2px 6px 2px rgba(10,26,51,.14),0 8px 24px rgba(10,26,51,.18),0 1px 2px rgba(10,26,51,.25);
 --mk-pill-shadow:0 10px 22px rgba(10,26,51,.16),0 3px 7px rgba(10,26,51,.10),inset 0 1px 0 rgba(255,255,255,.9);--mk-pill-on:0 4px 10px rgba(10,26,51,.35);
 --mk-fab-shadow:0 10px 22px rgba(10,26,51,.28),0 3px 7px rgba(10,26,51,.18)}
:root.mk-dark{--mk-pop:0 2px 6px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.6);
 --mk-pill-shadow:0 12px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);--mk-pill-on:0 4px 12px rgba(0,0,0,.55);--mk-fab-shadow:0 10px 24px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.45)}

/* ---------- 3 · ripple on every tap ---------- */
.mk-rw{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.mk-rel{position:relative}
.mk-rip{position:absolute;border-radius:50%;background:currentColor;opacity:.24;transform:scale(0);pointer-events:none;animation:mkRip .55s ease-out forwards}
@keyframes mkRip{to{transform:scale(1);opacity:0}}
.rip,.rpl,.ripple{display:none!important}

/* ---------- 3 · pill tab bar with drop shadow ---------- */
.mk-tabs{display:flex!important;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;background:var(--mk-card)!important;
 border:1px solid var(--mk-line)!important;border-radius:26px!important;padding:6px!important;box-shadow:var(--mk-pill-shadow)!important}
.mk-tabs::-webkit-scrollbar{display:none}
.mk-tab{position:relative;flex:0 0 auto;border:0;background:transparent;color:var(--mk-mute);padding:11px 18px;border-radius:21px!important;font-size:15px;font-weight:700;cursor:pointer;
 text-decoration:none;transition:background-color .28s,color .28s,box-shadow .28s,transform .2s}
.mk-tab:active{transform:scale(.96)}
.mk-tab.on{background:var(--mk-ink)!important;color:var(--mk-bg)!important;box-shadow:var(--mk-pill-on)}

/* ---------- 4 · every add button is a pill ---------- */
.fab,.mk-add{border-radius:999px!important}
.fab{box-shadow:var(--mk-fab-shadow);transition:transform .18s var(--mk-ease),box-shadow .18s,opacity .2s}
.fab:active{transform:scale(.96)}

/* ---------- 8 · round check boxes ---------- */
input[type=checkbox]:not(.mk-keep){-webkit-appearance:none;appearance:none;position:relative;flex:none;display:inline-block;width:22px;height:22px;min-height:0;margin:0;padding:0;
 border:2px solid var(--mk-outline);border-radius:50%!important;background:transparent;cursor:pointer;vertical-align:middle;transition:background-color .18s,border-color .18s}
input[type=checkbox]:not(.mk-keep)::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--mk-on);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.2,.8,.3,1.5)}
input[type=checkbox]:not(.mk-keep):checked{background:var(--mk-acc);border-color:var(--mk-acc)}
input[type=checkbox]:not(.mk-keep):checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox]:focus{outline:none}

/* ---------- 9 / 10 · title with the green dot, round-square gear ---------- */
.mk-title{font-size:32px!important;line-height:1.1!important;font-weight:800!important;letter-spacing:-.6px;color:var(--mk-ink)}
.mk-dot{color:var(--mk-dot)}
.mk-hbtn.hide,.mk-hbtn[hidden]{display:none!important}
.mk-hbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:50px!important;height:50px!important;border-radius:17px!important;
 border:1px solid var(--mk-line)!important;background:var(--mk-card)!important;color:var(--mk-ink)!important;flex:0 0 auto;padding:0;cursor:pointer;transition:transform .3s var(--mk-ease)}
.mk-hbtn svg{width:22px;height:22px}
.mk-gear:active svg{transform:rotate(60deg)}.mk-gear svg{transition:transform .3s var(--mk-ease)}

/* ---------- 7 / 11 · dropdown menus: shadow, no scroll chaining, bounce ---------- */
.mk-menu{box-shadow:var(--mk-pop)!important;overscroll-behavior:none!important;border-radius:12px!important}
.mk-dd{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:54px;padding:0 10px 0 16px;border:1px solid var(--mk-outline);border-radius:8px;
 background:transparent;color:var(--mk-ink);font:inherit;font-size:16px;text-align:start;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.mk-dd.open{border-color:var(--mk-acc);box-shadow:inset 0 0 0 1px var(--mk-acc)}
.mk-dd .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mk-dd.ph .v{color:var(--mk-mute)}
.mk-dd svg{flex:none;color:var(--mk-mute);transition:transform .2s}.mk-dd.open .ch{transform:rotate(180deg);color:var(--mk-acc)}
.mk-mask{position:fixed;inset:0;z-index:1990;background:transparent}
.mk-ddmenu{position:fixed;z-index:1991;background:var(--mk-card);color:var(--mk-ink);padding:8px 0;overflow-y:auto;transform-origin:top center}
.mk-ddmenu button{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:inherit;text-align:start;font:inherit;font-size:16px;padding:0 16px;min-height:48px;cursor:pointer}
.mk-ddmenu button.sel{background:var(--mk-tint);color:var(--mk-acc);font-weight:600}
/* dropdowns open as a centred pop-up list (Material 3 simple dialog), above every screen */
.mk-mask.mk-dim{z-index:2147482000;background:rgba(2,6,23,.5);animation:mkFadeIn .18s ease both}
.mk-ddmenu.mk-ddpop{z-index:2147482001;inset:0!important;margin:auto!important;width:min(360px,calc(100vw - 48px))!important;height:fit-content;max-height:min(72vh,540px)!important;
 border-radius:28px;padding:0 0 10px;box-shadow:0 24px 60px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.22);transform-origin:center}
.mk-ddpop .mk-pt{position:sticky;top:0;z-index:1;background:var(--mk-card);padding:20px 24px 12px;font-size:19px;font-weight:700;line-height:1.25;border-bottom:1px solid var(--mk-line)}
.mk-ddpop button{min-height:54px;padding:0 24px;gap:16px;font-size:16px}
.mk-ddpop button span{flex:1}
.mk-ddpop button .mk-rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--mk-mute);position:relative}
.mk-ddpop button.sel{background:var(--mk-tint)}
.mk-ddpop button.sel .mk-rd{border-color:var(--mk-acc)}
.mk-ddpop button.sel .mk-rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--mk-acc)}
.mk-ddpop[data-mk-kind=menu]:not([data-mk-seen]):not(.mk-ghost){animation:mkDlgIn .24s var(--mk-ease) both!important;transform-origin:center}
.mk-ghost.mk-ddpop[data-mk-kind=menu]{animation:mkDlgOut .2s ease forwards!important}
.mk-bnc>*{transform:translateY(var(--mk-bo,0px))}
.mk-settle>*{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}

/* ---------- 13 · the page under a popup stays still ---------- */
html.mk-lock,html.mk-lock body{overflow:hidden!important;overscroll-behavior:none!important}
.mk-scroll{overscroll-behavior:none!important}

/* ---------- 14 · no blinking while picking several things ---------- */
/* (quiet mode finishes entrance animations instantly from JS; a CSS 'animation:none' switch would replay them all when it ends) */

/* ---------- 15 · smooth transitions ---------- */
@keyframes mkFadeIn{from{opacity:0}}
@keyframes mkFadeOut{to{opacity:0}}
@keyframes mkSheetIn{from{transform:translateY(100%)}}
@keyframes mkSheetOut{to{transform:translateY(100%)}}
@keyframes mkDlgIn{from{opacity:0;transform:scale(.9)}}

#m3fb .fb-seg button{border:0;background:transparent;color:var(--fb-ink);padding:11px 6px;font:inherit;font-weight:500;cursor:pointer}
#m3fb .fb-seg button+button{border-inline-start:1px solid var(--fb-line)}
#m3fb .fb-seg button.on{background:var(--fb-tint);color:var(--fb-acc)}
#m3fb label.fb-f{display:block;position:relative;margin:0 0 12px}
#m3fb label.fb-f span{position:absolute;top:-8px;inset-inline-start:12px;padding:0 5px;background:var(--fb-card);color:var(--fb-mute);font-size:12px}
#m3fb input,#m3fb textarea{width:100%;box-sizing:border-box;border:1px solid var(--fb-line);border-radius:12px;background:transparent;color:var(--fb-ink);padding:14px 13px 12px;font:inherit;outline:0}
#m3fb textarea{min-height:96px;resize:vertical}
#m3fb input:focus,#m3fb textarea:focus{border-color:var(--fb-acc);box-shadow:0 0 0 1px var(--fb-acc)}
#m3fb .fb-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#m3fb .fb-t{font-size:13px;color:var(--fb-mute);margin:14px 2px 8px;font-weight:500}
#m3fb .fb-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--fb-line);border-radius:999px;background:transparent;color:var(--fb-acc);padding:10px 18px;font:inherit;font-weight:500;cursor:pointer}
#m3fb .fb-rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#m3fb .fb-rec.live .fb-btn{background:#d93025;color:#fff;border-color:#d93025}
#m3fb .fb-dot{width:10px;height:10px;border-radius:50%;background:#d93025;animation:m3fbp 1s infinite}
@keyframes m3fbp{50%{opacity:.25}}
#m3fb audio{height:40px;flex:1;min-width:180px}
#m3fb .fb-ph{display:flex;gap:8px;flex-wrap:wrap}
#m3fb .fb-ph div{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;border:1px solid var(--fb-line)}
#m3fb .fb-ph img{width:100%;height:100%;object-fit:cover}
#m3fb .fb-ph i{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font:14px/22px sans-serif;text-align:center;font-style:normal;cursor:pointer}
#m3fb .fb-ph .fb-add{display:flex;align-items:center;justify-content:center;color:var(--fb-acc);font-size:26px;cursor:pointer;border-style:dashed}
#m3fb .fb-err{color:#d93025;font-size:13px;min-height:18px;margin:8px 2px 0}
#m3fb .fb-go{width:100%;margin-top:6px;border:0;border-radius:999px;background:var(--fb-acc);color:var(--fb-on);padding:14px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
#m3fb .fb-go:disabled{opacity:.6}
#m3fb .fb-meta{color:var(--fb-mute);font-size:12px;text-align:center;margin-top:10px}
#m3fb .fb-done{text-align:center;padding:26px 6px 10px}
#m3fb .fb-done b{display:block;font-size:20px;margin:12px 0 6px}

(function(){

  if(type==='sick'){r.leave.sick=1;return r}
  if(type==='unpaid'){r.leave.unpaid=1;return r}
  let expS=tm(sch.start),expE=tm(sch.end);
  if(type==='halfAM'){expS=13*60;r.leave.half=1}
  if(type==='halfPM'){expE=13*60;r.leave.half=1}
  r.expS=expS;r.expE=expE;
  const cov=union(perms.concat(trips));
  if(hasIn){
    const a=tm(rec.in);
    if(a>expS){r.lateRaw=Math.max(0,a-expS-covered(cov,expS,a));r.late=r.lateRaw<=graceMin()?0:Math.ceil(r.lateRaw/30)*30}
  }
  if(hasOut){
    const b=tm(rec.out);
    if(b<expE){r.earlyRaw=Math.max(0,expE-b-covered(cov,b,expE));r.early=r.earlyRaw<=graceMin()?0:Math.ceil(r.earlyRaw/30)*30}
    else if(b>expE&&type==='work'){r.otMin=b-expE;r.ot=Math.floor(r.otMin/60)}
  }
  if(hasIn&&!hasOut)r.noOut=true;
  if(!hasIn&&!hasOut&&covered(cov,expS,expE)<expE-expS)r.incomplete=true;
  if(hasIn!==hasOut&&hasOut)r.incomplete=true;
  return r;
}

const TYPE_LABEL={annual:'Annual leave',casual:'Casual leave',halfAM:'Morning half day',halfPM:'Night half day',sick:'Sick leave',unpaid:'Unpaid leave',work:'Work day'};
const TYPE_ORDER=Object.keys(TYPE_LABEL).sort((a,b)=>TYPE_LABEL[a].localeCompare(TYPE_LABEL[b]));

function tags(rec,c){
  const t=[];
  if(c.kind==='workday'&&c.type!=='work')t.push(['info',TYPE_LABEL[c.type]]);
  if(c.late)t.push(['bad','Late '+fm(c.late)]);
  if(c.early)t.push(['bad','Early '+fm(c.early)]);
  if(c.perm)t.push(['info','Permission '+fm(c.perm)]);
  if(c.tripMin)t.push(['info','Trip '+fm(c.tripMin)]);
  if(c.brk)t.push(['mute','Breaks '+fm(c.brk)+(c.brkN>1?' ('+c.brkN+')':'')]);
  if(c.ot)t.push(['ok','Overtime '+c.ot+'h']);
  if(c.credit)t.push(['ok','+1 leave day']);
  if(c.noOut)t.push(['warn','No clock-out']);
  if(c.incomplete)t.push(['warn','Incomplete']);
  if(c.kind!=='workday'&&!rec.in&&!rec.out)t.push(['info','Planned work']);
  if(rec.alarm)t.push(['info','⏰ '+rec.alarm]);
  if(!t.length&&(rec.in||rec.out))t.push(['mute',(rec.in||'?')+' – '+(rec.out||'?')]);
  if(rec.inBal)t.push(['mute','In your balance']);
  if(rec.otPlan&&!rec.out)t.push(['info',rec.otPlan.state==='stay'&&rec.otPlan.until?'Overtime until '+rec.otPlan.until:'Overtime planned']);
  return t.map(x=>'<span class="tag '+x[0]+'">'+esc(x[1])+'</span>').join('');
}

/* ================= statistics ================= */
function monthStats(ym){
  const p=ym.split('-'),y=+p[0],m=+p[1]-1,n=new Date(y,m+1,0).getDate(),now=todayStr();
  const st={late:0,early:0,perm:0,lateDays:0,earlyDays:0,otWork:0,otWeekend:0,otHoliday:0,credit:0,annual:0,casual:0,half:0,sick:0,unpaid:0,trips:0,balUsed:0,missing:[],rows:[]};
  for(let i=1;i<=n;i++){
    const d=y+'-'+pad(m+1)+'-'+pad(i),rec=S.days[d],kind=kindOf(d);let c=null;
    if(rec){
      c=calc(rec);
      st.late+=c.late;st.early+=c.early;st.perm+=c.perm;st.trips+=c.tripMin;
      if(!rec.inBal)st.balUsed+=c.late+c.early+c.perm;
      if(c.late)st.lateDays++;if(c.early)st.earlyDays++;
      if(kind==='workday')st.otWork+=c.ot;else if(kind==='weekend')st.otWeekend+=c.ot;else st.otHoliday+=c.ot;
      st.credit+=c.credit;st.annual+=c.leave.annual;st.casual+=c.leave.casual;st.sick+=c.leave.sick;st.unpaid+=c.leave.unpaid;st.half+=c.leave.half;
    }else if(kind==='workday'&&d<now)st.missing.push(d);
    st.rows.push({d:d,rec:rec,c:c,kind:kind});
  }
  st.used=st.balUsed;st.base=Math.round(S.settings.permHours*60);st.free=Math.max(0,st.base+(+S.adj.months[ym]||0));
  st.deduct=Math.max(0,st.used-st.free);st.left=Math.max(0,st.free-st.used);
  st.ot=st.otWork+st.otWeekend+st.otHoliday;
  return st;
}
function yearStats(y){
  const s={annualUsed:0,casualUsed:0,halfDays:0,sickUsed:0,unpaid:0,credits:0};
  Object.keys(S.days).forEach(d=>{
    if(d.indexOf(y+'-')!==0)return;
    const c=calc(S.days[d]);
    if(S.days[d].inBal){s.unpaid+=c.leave.unpaid;return}
    s.annualUsed+=c.leave.annual;s.casualUsed+=c.leave.casual;s.halfDays+=c.leave.half;
    s.sickUsed+=c.leave.sick;s.unpaid+=c.leave.unpaid;s.credits+=c.credit;
  });
  const aj=S.adj.years[y]||{};
  s.adjAnnual=+aj.annual||0;s.adjCasual=+aj.casual||0;s.adjSick=+aj.sick||0;
  s.allowance=S.settings.annual+s.credits+s.adjAnnual;
  s.totalUsed=s.annualUsed+s.casualUsed+s.halfDays*0.5;
  s.left=s.allowance-s.totalUsed;
  s.casualAllow=S.settings.casual+s.adjCasual;s.casualLeft=s.casualAllow-s.casualUsed;
  s.sickAllow=S.settings.sick+s.adjSick;s.sickLeft=s.sickAllow-s.sickUsed;
  return s;
}

  if(skip)L.push('Skips '+skip+' weekend/holiday day'+(skip>1?'s':'')+' — leave only counts on workdays');
  if(!leave){const off=ds.filter(d=>kindOf(d)!=='workday').length;if(off)L.push(off+' weekend/holiday day'+(off>1?'s':'')+' will count as overtime')}
  return L.join('<br>');
}
function saveBulk(bal){
  const b=bulk;if(!b||!sel)return;
  const leave=b.type!=='work',now=todayStr();
  if(!leave&&!b.normal){
    if(!TIME.test(b.in)||!TIME.test(b.out)){toast('Add clock-in and clock-out times');return}
    if(tm(b.out)<=tm(b.in)){toast('Clock-out must be after clock-in');return}
  }
  const recs=[];
  [...sel].sort().forEach(d=>{
    const kind=kindOf(d);
    if(leave&&kind!=='workday')return;
    const ex=S.days[d],sc=schedule(d),keep=!leave&&kind==='workday'&&ex&&ex.type==='work';
    const r={date:d,type:b.type,in:leave?'':(b.normal?sc.start:b.in),out:leave?'':(b.normal?sc.end:b.out),
      perms:keep?(ex.perms||[]):[],trips:keep?(ex.trips||[]):[],holidayMode:(ex&&ex.holidayMode)||'ot',note:b.note.trim()||(ex&&ex.note)||''};
    if(ex&&ex.alarm&&d>=now)r.alarm=ex.alarm;
    if(ex&&ex.otPlan)r.otPlan=ex.otPlan;
    recs.push(r);
  });
  if(!recs.length){toast('Leave only applies to workdays — none of the selected days are workdays');return}
  if(balFlag(recs,bal)==='ask')return;
  recs.forEach(r=>{S.days[r.date]=r});
  save();closeModal();selExit();
  toast(TYPE_LABEL[b.type]+' recorded for '+recs.length+' day'+(recs.length>1?'s':''));
}

function tick(){
  const t=$('#timer');if(!t)return;
  const rec=S.days[todayStr()];if(!rec||!rec.in||rec.out)return;
  const n=new Date(),a=tm(rec.in),b=n.getHours()*60+n.getMinutes();
  let sec=(b-a)*60+n.getSeconds();if(sec<0)sec=0;
  t.textContent=pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec/60)%60)+':'+pad(sec%60);
  const bt=$('#btimer'),ob=openBreak(rec);
  if(bt&&ob){const s2=Math.max(0,Math.floor((Date.now()-(ob.t||Date.now()))/1000));bt.textContent=(s2>=3600?Math.floor(s2/3600)+':':'')+pad(Math.floor(s2/60)%60)+':'+pad(s2%60)}
}

/* ================= clock in / out ================= */
function blank(d){return {date:d,type:'work',in:'',out:'',perms:[],trips:[],breaks:[],holidayMode:'ot',note:''}}
function clockIn(){
  const d=todayStr();let rec=S.days[d];
  if(!rec)rec=S.days[d]=blank(d);
  rec.in=hm(new Date());rec.out='';
  save();render();toast('Clocked in at '+rec.in);
}
const openPerm=rec=>(rec.perms||[]).find(x=>x.from&&!x.to);
function stepOut(){
  const rec=S.days[todayStr()];if(!rec||!rec.in||rec.out)return;
  if(!rec.perms)rec.perms=[];
  if(openPerm(rec))return;
  rec.perms.push({from:hm(new Date()),to:''});
  save();render();toast('Stepped out at '+rec.perms[rec.perms.length-1].from+' — tap Back in when you return');
}
function backIn(){
  const rec=S.days[todayStr()];if(!rec)return;
  const p=openPerm(rec);if(!p)return;
  p.to=hm(new Date());
  if(tm(p.to)<=tm(p.from))rec.perms.splice(rec.perms.indexOf(p),1);
  save();render();
  const m=ranges([p])[0];toast(m?'Back in — permission '+fm(m[1]-m[0]):'Back in');
}
const openBreak=rec=>(rec.breaks||[]).find(x=>x.from&&!x.to);
function breakStart(){
  const rec=S.days[todayStr()];if(!rec||!rec.in||rec.out||openPerm(rec)||openBreak(rec))return;
  if(!rec.breaks)rec.breaks=[];
  rec.breaks.push({from:hm(new Date()),to:'',t:Date.now()});
  save();render();toast('Break started at '+rec.breaks[rec.breaks.length-1].from);
}
function endBreak(rec,at){
  const b=openBreak(rec);if(!b)return null;
  b.to=at;delete b.t;
  if(tm(b.to)<=tm(b.from)){rec.breaks.splice(rec.breaks.indexOf(b),1);return 0}
  return tm(b.to)-tm(b.from);
}
function breakEnd(){
  const rec=S.days[todayStr()];if(!rec)return;
  const m=endBreak(rec,hm(new Date()));if(m===null)return;
  save();render();
  const tot=ranges(rec.breaks).reduce((a,x)=>a+x[1]-x[0],0);
  toast(m?'Break over — '+fm(m)+' · '+fm(tot)+' in breaks today':'Break ended (under a minute, not recorded)');
}
function clockOut(){
  const d=todayStr(),rec=S.days[d];if(!rec||!rec.in)return;
  const op=openPerm(rec);if(op)rec.perms.splice(rec.perms.indexOf(op),1); /* leaving for the day while stepped out: no permission is recorded for the open gap */
  rec.out=hm(new Date());
  endBreak(rec,rec.out); /* clocking out during a break ends the break at the same time */
  save();render();
  const c=calc(rec),bits=[];
  if(c.late)bits.push('late '+fm(c.late));if(c.early)bits.push('early '+fm(c.early));if(c.ot)bits.push('overtime '+c.ot+'h');
  toast('Clocked out at '+rec.out+(bits.length?' · '+bits.join(', '):''));
}

/* ================= day editor ================= */
function openDay(date,opts){
  const ex=S.days[date];
  draft=ex?JSON.parse(JSON.stringify(ex)):blank(date);
  draft.perms=draft.perms||[];draft.trips=draft.trips||[];draft.breaks=draft.breaks||[];
  draft._new=!ex;draft._orig=date;
  if(opts&&opts.type&&draft._new)draft.type=opts.type;
  autoAlarm();
  if(opts&&opts.perm)draft.perms.push({from:'',to:''});
  if(opts&&opts.trip)draft.trips.push({from:'',to:''});
  renderDay();
}
function clean(d){

/* Working days between From and To: weekends and holidays in the middle are skipped, not counted. */
function leaveSpan(){
  const a=draft.date,b=(draft.endDate&&draft.endDate>=a)?draft.endDate:a;
  const days=[];let skipped=0,n=0;
  const cur=parseYmd(a),end=parseYmd(b);
  while(cur<=end&&n<400){const s=ymd(cur);if(kindOf(s)==='workday')days.push(s);else skipped++;cur.setDate(cur.getDate()+1);n++}
  return {a:a,b:b,days:days,skipped:skipped};
}

  const rep=sp.days.filter(d=>{const x=S.days[d];return x&&(x.type!==draft.type||x.in||x.out)}).length;

function needsBalChoice(r){

function balFlag(recs,bal){

  let ch=bal;
  if(ch===undefined&&draft&&draft.inBal!==undefined&&recs.length===1)ch=draft.inBal?'in':'out';

}

    '<div class="sub" style="margin-top:6px"><button class="link" data-a="bal-back">Back to the day</button></div>');

function saveDay(bal){
  if(draft.type==='hol'){
    const f=draft.date,t=(draft.endDate&&draft.endDate>=f)?draft.endDate:f,n=(draft.hname||'').trim()||'Holiday';
    if(!f){toast('Choose a date');return}
    if(!S.holidays.some(h=>h.from===f&&h.to===t&&h.name===n))S.holidays=S.holidays.concat({id:uid(),name:n,from:f,to:t});
    ui.month=f.slice(0,7);ui.stab='holidays';
    save();closeModal();render();toast('Holiday added to the Holidays list');return;
  }
  const d=clean(draft),kind=kindOf(d.date);
  if(!d.date){toast('Choose a date');return}
  const leave=LEAVE.indexOf(d.type)>=0;
  if(leave){
    if(draft.endDate&&draft.endDate<d.date){toast('The end date is before the start date');return}
    const sp=leaveSpan();
    if(!sp.days.length){toast('No working days in that range — weekends and holidays are skipped');return}
    const recsL=sp.days.map(x=>({date:x,type:d.type,in:'',out:'',perms:[],trips:[],holidayMode:'ot',note:d.note}));
    if(balFlag(recsL,bal)==='ask')return;
    if(draft._orig&&S.days[draft._orig]&&sp.days.indexOf(draft._orig)<0)delete S.days[draft._orig];
    recsL.forEach(r=>{S.days[r.date]=r});
    ui.month=sp.days[0].slice(0,7);
    save();closeModal();render();
    toast(TYPE_LABEL[d.type]+' saved — '+sp.days.length+' working day'+(sp.days.length>1?'s':'')+(sp.skipped?' ('+sp.skipped+' day'+(sp.skipped>1?'s':'')+' off skipped)':''));
    return;
  }
  if(!leave){
    if(d.in&&!TIME.test(d.in)||d.out&&!TIME.test(d.out)){toast('Check the times');return}
    if(kind==='workday'&&d.in&&d.out&&tm(d.out)<=tm(d.in)){toast('Clock-out must be after clock-in');return}
    if(!d.in&&d.out){toast('Add a clock-in time');return}
    for(const k of ['perms','trips','breaks']){
      for(const x of d[k]){
        if(k==='breaks'&&x.t&&!x.to&&d.date===todayStr()&&TIME.test(x.from))continue; /* today's break still running */
        if(!TIME.test(x.from)||!TIME.test(x.to)||tm(x.to)<=tm(x.from)){toast('Check the '+({perms:'permission',trips:'trip',breaks:'break'})[k]+' times');return}

  }
  if(balFlag([d],bal)==='ask')return;
  if(draft._orig!==d.date)delete S.days[draft._orig];
  S.days[d.date]=d;
  ui.month=d.date.slice(0,7);
  save();closeModal();render();toast('Saved');
}

/* Sets what is left, by storing the difference from what the recorded days alone would give. */
function setLeft(kind,v,y){
  const ys=yearStats(y);
  const base={annual:ys.left-ys.adjAnnual,casual:ys.casualLeft-ys.adjCasual,sick:ys.sickLeft-ys.adjSick}[kind];
  const aj=S.adj.years[y]||(S.adj.years[y]={});
  const d=r2(v-base);
  if(d===0)delete aj[kind];else aj[kind]=d;
  if(!Object.keys(aj).length)delete S.adj.years[y];
}
function setPermLeft(hours,ym){
  const ms=monthStats(ym),want=Math.round(hours*60)+ms.used;
  const d=want-ms.base;
  if(d===0)delete S.adj.months[ym];else S.adj.months[ym]=d;

const normAr=s=>String(s||'').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const cellText=td=>td.textContent.replace(/ /g,' ').replace(/\s+/g,' ').trim();
function num(s){
  const t=String(s||'').replace(/,/g,'').trim();
  if(/^-?\d+(\.\d+)?$/.test(t))return parseFloat(t);
  const m=t.match(/^(\d+(?:\.\d+)?)-$/);
  return m?-parseFloat(m[1]):null;
}
const sgn=n=>(n>0?'+':'')+fd(n);
const m2=n=>(n==null?0:n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const EN_RAW={

  'قسط شراء مدة':'Service-period purchase installment','مشاركة مجتمعية':'Community participation',
  'تسوية دفعة مقدمة مكافآت':'Advance settlement – bonuses','تسوية دفعة مقدمة عمولات':'Advance settlement – commissions',
  'تأمين سيارة':'Car insurance','استقطاعات مزايا عاملين':'Employee benefit deductions','إنتقالات':'Transport','قسط بنك':'Bank installment',

};
const EN={};Object.keys(EN_RAW).forEach(k=>{EN[normAr(k)]=EN_RAW[k]});
const labelHtml=l=>{const en=EN[normAr(l)];return en?esc(en)+'<div class="muted small" dir="auto">'+esc(l)+'</div>':'<span dir="auto">'+esc(l)+'</span>'};
const isOT=l=>{const n=normAr(l);return n.indexOf('اضاف')>=0&&n.indexOf('علاو')<0};
const isAbs=l=>normAr(l).indexOf('غياب')>=0;

/* Reads the company's "Employee Remuneration statement" HTML. Nothing leaves the phone. */
function parsePayslip(html){
  let doc;try{doc=new DOMParser().parseFromString(html,'text/html')}catch(e){return null}
  const all=(doc.body?doc.body.textContent:'').replace(/ /g,' ');
  const mm=all.match(/for\s*:\s*(\d{1,2})\s*\/\s*(\d{4})/i);
  if(!mm)return null;
  const mo=+mm[1];if(mo<1||mo>12)return null;
  const p={month:mm[2]+'-'+pad(mo),earn:[],ded:[],orders:[],totEarn:null,totDed:null,netIncome:null,net:null,ordersTotal:null,ok:true};
  let after=false;
  Array.prototype.forEach.call(doc.querySelectorAll('tr'),tr=>{
    const c=Array.prototype.map.call(tr.children,cellText);
    if(!c.length)return;
    if(/^net\s*:/i.test(c[0])){p.net=num(c[0].replace(/^net\s*:/i,''));after=true;return}
    if(!after){
      if(c.length>=4){
        const dl=c[1],dv=num(c[0]),el=c[3],ev=num(c[2]);
        if(normAr(dl).indexOf('اجمالي')>=0||normAr(el).indexOf('اجمالي')>=0){
          if(dv!==null)p.totDed=dv;if(ev!==null)p.totEarn=ev;return;
        }
        if(dl&&dv!==null)p.ded.push({label:dl,amount:dv});
        if(el&&ev!==null)p.earn.push({label:el,amount:ev});
      }else if(c.length===2&&num(c[0])!==null&&normAr(c[1]).indexOf('صافي')>=0){p.netIncome=num(c[0])}
    }else if(c.length===2){
      const v=num(c[0]),l=c[1];if(!l)return;
      if(normAr(l).indexOf('اجمالي')>=0){if(v!==null)p.ordersTotal=v;return}
      if(v!==null)p.orders.push({label:l,amount:v});
    }
  });
  if(!p.earn.length&&!p.ded.length)return null;
  const se=p.earn.reduce((a,x)=>a+x.amount,0),sd=p.ded.reduce((a,x)=>a+x.amount,0);
  p.ok=(p.totEarn===null||Math.abs(se-p.totEarn)<0.015)&&(p.totDed===null||Math.abs(sd-p.totDed)<0.015);
  return p;
}
function importPayslips(files){
  const list=Array.prototype.slice.call(files||[]);if(!list.length)return;
  toast('Reading '+list.length+' file'+(list.length>1?'s':'')+'…');
  let done=0,good=0,last=null;
  list.forEach(f=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const p=parsePayslip(String(fr.result||''));
      if(p){S.payslips=S.payslips.filter(x=>x.month!==p.month).concat(p);good++;last=p.month}
      if(++done===list.length)finish();
    };
    fr.onerror=()=>{if(++done===list.length)finish()};
    fr.readAsText(f,'utf-8');
  });
  function finish(){
    save();render();
    if(!good){toast('Could not read that file as a payslip');return}
    toast('Imported '+good+' payslip'+(good>1?'s':'')+(good<list.length?' ('+(list.length-good)+' not recognised)':''));
    if(good===1&&last)payDetail(last);
  }
}
function vPay(){
  let h='<button class="btn full" data-a="payimport">Import payslip</button>'+
    '<div class="muted small center" style="margin:8px 0 14px">Choose the payslip .htm file. It is read on this phone only.</div>';
  const list=S.payslips.slice().sort((a,b)=>a.month<b.month?1:-1);
  h+='<section class="card" style="padding:6px 16px">';
  if(!list.length)h+='<div class="empty">No payslips imported yet.</div>';
  list.forEach(p=>{

      (ot?'<span class="tag ok">Overtime '+m2(ot)+'</span>':'')+(dd?'<span class="tag bad">Deducted '+m2(dd)+'</span>':'')+'</span></button>';

}
function payLines(items){
  const v=items.filter(x=>x.amount!==0);

  return v.map(x=>'<div class="line"><span>'+labelHtml(x.label)+'</span><b>'+m2(x.amount)+'</b></div>').join('');
}
function verdict(paid,app){
  if(paid>0&&app)return ['info','Both show it'];
  if(paid>0&&!app)return ['warn','Payslip only'];
  if(!paid&&app)return ['warn','App only'];
  return ['ok','None on both'];
}
const vTag=v=>'<span class="tag '+v[0]+'">'+v[1]+'</span>';
function payCompare(p){
  const pm=prevMonth(p.month),st=monthStats(pm),title=monthTitle(pm);
  let h='<h4 style="margin-top:18px">Check against '+esc(title)+'</h4>';
  if(!st.rows.some(r=>r.rec))return h+'<div class="muted small">No attendance was recorded in the app for '+esc(title)+', so there is nothing to compare.</div>';
  const otPaid=sumBy(p.earn,isOT),hrs=st.ot;

  h+='<div class="line" style="padding-bottom:0"><b>Overtime</b>'+vTag(v1)+'</div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">Payslip paid</span><span>'+m2(otPaid)+'</span></div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">App counted</span><span>'+hrs+'h (weekdays '+st.otWork+', weekends '+st.otWeekend+', holidays '+st.otHoliday+')</span></div>'+
    (otPaid>0&&hrs>0?'<div class="line" style="padding:2px 0"><span class="muted small">Average paid per hour</span><span>'+m2(otPaid/hrs)+'</span></div>':'');
  const abs=sumBy(p.ded,isAbs),unp=sumBy(p.ded,isUnpaid),sick=sumBy(p.ded,isSickL);
  const appDed=st.unpaid>0||st.deduct>0||st.missing.length>0;
  const v2=verdict(abs+unp,appDed);
  h+='<div class="line" style="padding-bottom:0;margin-top:10px"><b>Absence &amp; unpaid deductions</b>'+vTag(v2)+'</div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">Payslip deducted</span><span>Absence '+m2(abs)+' · Unpaid days '+m2(unp)+'</span></div>'+
    '<div class="line" style="padding:2px 0"><span class="muted small">App shows</span><span>Unpaid '+fd(st.unpaid)+' day(s) · Late/early over pool '+fm(st.deduct)+' · No record '+st.missing.length+' day(s)</span></div>';
  const basic=sumBy(p.earn,isBasic);
  if(unp>0&&st.unpaid>0)h+='<div class="line" style="padding:2px 0"><span class="muted small">Deducted per unpaid day</span><span>'+m2(unp/st.unpaid)+(basic?' (basic ÷ 30 = '+m2(basic/30)+')':'')+'</span></div>';
  if(sick>0||st.sick>0){
    h+='<div class="line" style="padding:2px 0;margin-top:8px"><span class="muted small">Sick leave</span><span>Payslip deducted '+m2(sick)+' · app '+fd(st.sick)+' day(s)</span></div>';
  }
  return h;
}
function payDetail(month){
  const p=S.payslips.find(x=>x.month===month);if(!p)return;
  let h='<h3>Payslip – '+esc(monthTitle(p.month))+'</h3>';

const hasNative=()=>!!(window.Android&&typeof window.Android.setPlan==='function');
const atTime=(dt,t)=>new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),+t.slice(0,2),+t.slice(3,5)).getTime();
function planItems(){
  const out=[],now=Date.now(),s=S.settings;
  for(let i=0;i<45;i++){
    const dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()+i);
    const d=ymd(dt),kind=kindOf(d),rec=S.days[d];
    if(rec&&TIME.test(rec.alarm||'')){
      const t=atTime(dt,rec.alarm);
      if(t>now)out.push({t:t,id:'alarm-'+d,k:'alarm',title:'⏰ Work day alarm',text:'Time to get up — you planned to work on '+dayShort(d)+'.'});
    }
    if(kind==='workday'&&rec&&rec.otPlan&&!rec.out&&!['annual','casual','sick','unpaid'].includes(rec.type)){
      const op=rec.otPlan,endT=schedule(d).end;
      if(op.state==='ask'){
        const t=atTime(dt,endT);
        if(t>now)out.push({t:t,id:'otask-'+d,k:'remind',title:'Going home or staying?',text:'Tap to answer. If you are going home, the app clocks you out at '+endT+'.'});
      }else if(op.state==='stay'&&TIME.test(op.until||'')){
        const t=atTime(dt,op.until),pre=t-10*60000;
        if(pre>now)out.push({t:pre,id:'otprep-'+d,k:'remind',title:'Get ready to leave',text:'You planned to leave at '+op.until+' — about 10 minutes to go.'});
        if(t>now)out.push({t:t,id:'otout-'+d,k:'remind',title:'Time to clock out',text:'You planned to leave now. Don\'t forget to clock out.'});
      }
    }
    if(!s.remindOn||kind!=='workday')continue;
    if(rec&&['annual','casual','sick','unpaid'].includes(rec.type))continue;
    const sch=schedule(d);
    let tin=s.remindIn;
    if(rec&&rec.type==='halfAM')tin='12:45';
    if(!(rec&&rec.in)){const t=atTime(dt,tin);if(t>now)out.push({t:t,id:'in-'+d,k:'remind',title:'Clock in',text:'Don\'t forget to clock in.'})}
    let tout=s.remindOut||sch.end;
    if(rec&&rec.type==='halfPM'&&!s.remindOut)tout='13:00';
    if(!(rec&&rec.out)&&!(rec&&rec.otPlan)){const t=atTime(dt,tout);if(t>now)out.push({t:t,id:'out-'+d,k:'remind',title:'Clock out',text:'Don\'t forget to clock out.'})}
  }
  return out;
}

  fetch(url).then(r=>r.ok?r.text():Promise.reject()).then(t=>cb(true,t),()=>cb(false,''));
}
const isoD=s=>s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
function addDaysStr(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function parseIcs(text){
  const lines=String(text||'').replace(/\r?\n[ \t]/g,'').split(/\r?\n/),ev=[];let cur=null;
  lines.forEach(l=>{
    if(l==='BEGIN:VEVENT')cur={};
    else if(l==='END:VEVENT'){if(cur&&cur.from)ev.push(cur);cur=null}
    else if(cur){
      if(/^DTSTART/.test(l)){const m=l.match(/(\d{8})/);if(m)cur.from=isoD(m[1])}
      else if(/^DTEND/.test(l)){const m=l.match(/(\d{8})/);if(m)cur.endEx=isoD(m[1])}
      else if(/^SUMMARY/.test(l))cur.name=l.replace(/^SUMMARY[^:]*:/,'').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/gi,' ').trim();
    }
  });
  return ev.map(e=>{
    let to=e.endEx?addDaysStr(e.endEx,-1):e.from;if(to<e.from)to=e.from;
    return {name:e.name||'Holiday',from:e.from,to:to};
  });
}
const holKey=h=>h.from+'|'+h.name;
function mergeHolidays(events){
  const y=new Date().getFullYear(),lo=y+'-01-01',hi=(y+1)+'-12-31';
  const old={};S.holidays.forEach(h=>{if(h.auto)old[holKey(h)]=1});
  S.holidays=S.holidays.filter(h=>!(h.auto&&h.from>=lo&&h.from<=hi));
  let added=0;
  events.forEach(e=>{
    if(e.from<lo||e.from>hi)return;
    const h={id:uid(),name:e.name,from:e.from,to:e.to,auto:true},k=holKey(h);
    if(S.skipHol.indexOf(k)>=0)return;
    if(S.holidays.some(x=>!x.auto&&x.from===h.from))return;
    if(S.holidays.some(x=>holKey(x)===k))return;
    S.holidays.push(h);if(!old[k])added++;
  });
  return added;
}
let holBusy=false;
function updateHolidays(silent){
  if(holBusy)return;holBusy=true;
  if(!silent)toast('Checking for official holidays…');
  let i=0;
  const next=()=>{
    if(i>=HOL_URLS.length){holBusy=false;if(!silent)toast('Could not reach the holiday calendar. Check your internet and try again.');return}
    netFetch(HOL_URLS[i++],(ok,txt)=>{
      const ev=ok?parseIcs(txt):[];
      if(ev.length){
        const n=mergeHolidays(ev);S.holLast=Date.now();save();holBusy=false;render();
        if(!silent||n)toast(n?'Holidays updated — '+n+' new':'Holidays are up to date');
      }else next();
    });
  };
  next();
}

    case 'ot-stay-save':otStaySave();break;

    case 'bal-in':if(bulk)saveBulk('in');else saveDay('in');break;

    case 'addrow':draft[t.dataset.key].push({from:'',to:''});renderDay();break;
    case 'delrow':draft[t.dataset.key].splice(+t.dataset.i,1);renderDay();break;
    case 'delday':{const d=draft._orig;ask('Delete the record for '+dayShort(d)+'?','Delete').then(ok=>{if(ok){delete S.days[d];save();closeModal();render();toast('Deleted')}});break}
    case 'ask-yes':{const r=resolver;resolver=null;closeModal();if(r)r(true);break}
    case 'ask-no':{const r=resolver;resolver=null;closeModal();if(r)r(false);break}

    case 'saveadj':saveAdjust();break;

    case 'resetmonth':resetMonth();break;

    case 'addhol':holForm(null);break;

    case 'savehol':saveHol(id);break;

      const h=S.holidays.find(x=>x.id===id);
      if(h&&h.auto&&S.skipHol.indexOf(holKey(h))<0)S.skipHol.push(holKey(h)); /* keep it removed after the next update */
      S.holidays=S.holidays.filter(x=>x.id!==id);save();closeModal();render();toast('Deleted');break;
    }
    case 'addper':perForm(null);break;
    case 'editper':perForm(id);break;
    case 'saveper':savePer(id);break;
    case 'delper':S.periods=S.periods.filter(h=>h.id!==id);save();closeModal();render();toast('Deleted');break;
    case 'csv':{const pre=ui.month+'-';showExport('CSV – '+monthTitle(ui.month),toCsv(Object.keys(S.days).filter(d=>d.indexOf(pre)===0)),'attendance-'+ui.month+'.csv','text/csv');break}

    case 'restore':openModal('<h3>Restore backup</h3><div class="muted small">Paste your backup text. This replaces all current data.</div><textarea id="imp" placeholder="Paste backup here"></textarea><div class="btns"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="doimport">Restore</button></div>');break;

});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='payfile'){const f=t.files;importPayslips(f);t.value='';return}
  if(t.dataset.set){setSetting(t.dataset.set,t.value);return}
  if(t.dataset.flag){S.settings[t.dataset.flag]=t.checked;save();toast(t.checked?'Reminders on':'Reminders off');return}
  if(t.id==='selall'&&sel){const all=selAllDates();all.forEach(d=>{if(t.checked)sel.add(d);else sel.delete(d)});selSync();return}
  if(t.id==='b-normal'&&bulk){bulk.normal=t.checked;bulkForm();return}
  if(t.dataset.wd!==undefined){
    const i=+t.dataset.wd,w=S.settings.workDays.filter(x=>x!==i);
    if(t.checked)w.push(i);S.settings.workDays=w.sort();save();toast('Saved');return;
  }
  if(!draft)return;
  if(t.id==='d-date'){
    const nd=t.value;if(!nd)return;
    if(!isRange(draft.type)&&nd!==draft._orig&&S.days[nd]){const keep=nd;closeModal();openDay(keep);toast('That day already has a record — opened it');return}
    draft.date=nd;
    if(kindOf(nd)!=='workday'&&(draft.type==='halfAM'||draft.type==='halfPM'))draft.type='work';
    autoAlarm();renderDay();return;
  }
  if(t.id==='d-end'){draft.endDate=t.value||draft.date;renderDay();return}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(bulk&&t.dataset.b&&$('#sheet').contains(t)){bulk[t.dataset.b]=t.value;const p=$('#bprev');if(p)p.innerHTML=bulkPreview();return}
  if(!draft||!$('#sheet').contains(t))return;
  if(t.id==='d-normal'){
    const sc=schedule(draft.date),i=$('[data-k=in]'),o=$('[data-k=out]');
    if(t.checked){draft.in=sc.start;draft.out=sc.end}
    else if(draft.in===sc.start&&draft.out===sc.end){draft.in='';draft.out=''}
    if(i)i.value=draft.in;if(o)o.value=draft.out;
    previewDay();return;
  }
  if(t.dataset.pre)delete t.dataset.pre;
  if(t.dataset.k){draft[t.dataset.k]=t.value;if(t.dataset.k==='alarm')draft._alarmTouched=true;
    if(t.dataset.k==='in'||t.dataset.k==='out'){const cb=$('#d-normal'),sc=schedule(draft.date);if(cb)cb.checked=draft.in===sc.start&&draft.out===sc.end}}
  else if(t.dataset.list)draft[t.dataset.list][+t.dataset.i][t.dataset.f]=t.value;
  else return;
  previewDay();
});
/* Empty clock-in opens the time picker on AM, clock-out on PM (the normal day's times). The value is saved right away,
   so pressing SET without changing it still records it; change or clear it in the picker if needed. */
function timePre(ev){
  const t=ev.target;if(!draft||!t||!t.matches||!t.matches('input[data-k=in],input[data-k=out]')||t.value)return;
  const sc=schedule(draft.date),k=t.dataset.k;
  t.value=k==='in'?sc.start:sc.end;draft[k]=t.value;
  const cb=$('#d-normal');if(cb)cb.checked=draft.in===sc.start&&draft.out===sc.end;
  previewDay();
}

/* ---- ripple on taps ---- */
document.addEventListener('pointerdown',ev=>{
  const b=ev.target.closest('.tab,.btn,.menu button,header button,.mcell,.yb,.row.selm,.sb-x,.fab');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2.2,x=ev.clientX-r.left-sz/2,y=ev.clientY-r.top-sz/2;
  const e=document.createElement('span');e.className='rip';e.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+x+'px;top:'+y+'px';
  b.appendChild(e);setTimeout(()=>e.remove(),650);
},{passive:true});
/* ---- swipe the screen left/right to move between tabs ---- */
(function(){
  let sx=0,sy=0,mode=0,on=false;const el=()=>$('#view');
  const blocked=t=>$('#modal').classList.contains('show')||$('#msmenu')||sel||t.closest('input,textarea,select,.ms,#top,.fab');
  document.addEventListener('touchstart',ev=>{
    on=false;mode=0;if(ev.touches.length!==1||tabIdx(view)<0||blocked(ev.target))return;
    sx=ev.touches[0].clientX;sy=ev.touches[0].clientY;on=true;el().classList.remove('snap');
  },{passive:true});
  document.addEventListener('touchmove',ev=>{
    if(!on)return;const dx=ev.touches[0].clientX-sx,dy=ev.touches[0].clientY-sy;
    if(!mode){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)mode=1;else if(Math.abs(dy)>12){on=false;return}}
    if(mode){const i=tabIdx(view),edge=(dx>0&&i===0)||(dx<0&&i===TABS.length-1);el().style.transform='translateX('+(dx*(edge?.12:.35))+'px)'}
  },{passive:true});
  document.addEventListener('touchend',ev=>{
    if(!on||!mode){on=false;return}on=false;
    const dx=ev.changedTouches[0].clientX-sx,i=tabIdx(view),e=el();
    const nxt=dx<0?i+1:i-1;
    if(Math.abs(dx)>70&&nxt>=0&&nxt<TABS.length){e.style.transform='';switchTab(TABS[nxt][0],dx<0?1:-1)}
    else{e.classList.add('snap');e.style.transform='';setTimeout(()=>e.classList.remove('snap'),260)}
  },{passive:true});
  document.addEventListener('touchcancel',()=>{on=false;el().style.transform=''},{passive:true});
})();
applyTheme();
window.__app={setMonth:ym=>{ui.month=ym;render()},stepOut:stepOut,backIn:backIn,checkOt:checkOt,otSnooze:otSnooze,adjust:{setLeft:setLeft,setPermLeft:setPermLeft},planItems:planItems,parseIcs:parseIcs,mergeHolidays:mergeHolidays,updateHolidays:updateHolidays,parsePayslip:parsePayslip,payCompare:payCompare,calc:calc,kindOf:kindOf,monthStats:monthStats,yearStats:yearStats,get:()=>S,set:o=>{S=o;save();render()}};
