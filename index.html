<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Time Sheet</title>
<style>
:root{
  --bg:#f3f6f8;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --accent:#0f766e;--on-accent:#ffffff;--accent-soft:#d9f2ee;--danger:#dc2626;--warn:#b45309;--warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#131c2e;--text:#e6edf6;--muted:#8da0b8;--line:#23304a;
    --accent:#2dd4bf;--on-accent:#04201c;--accent-soft:#12332f;--danger:#f87171;--warn:#fbbf24;--warn-soft:#3a2d0b;
    --shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--on-accent);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:18px;letter-spacing:.2px}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 8px;font-size:11px;font-weight:600;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{text-align:center}
.timer{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 2px;letter-spacing:1px}
.muted{color:var(--muted)}.small{font-size:13px}
h3{margin:0 0 12px;font-size:18px}
h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:block;text-align:left;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0}
input,select,textarea{width:100%;margin-top:5px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
textarea{min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;
  background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{width:100%;padding:16px;font-size:18px;margin-top:12px}
.btn.sm{padding:8px 12px;font-size:14px}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);padding:11px 0;color:inherit;font:inherit;cursor:pointer}
.row:first-of-type{border-top:0}
.dur{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dayhead b{font-size:15px}
.badge{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month b{font-size:17px}
.month button{border:0;background:var(--card);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:6px 8px 6px 12px;font-weight:600;font-size:14px}
.chip button{border:0;background:none;color:inherit;font-size:16px;cursor:pointer;padding:0 4px}
.addrow{display:flex;gap:8px}.addrow input{margin-top:0}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;width:56px;height:56px;border-radius:28px;
  border:0;background:var(--accent);color:var(--on-accent);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(2,6,23,.55);display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>Time Sheet</header>
<main id="view"></main>
<button class="fab" id="fab" data-a="new" aria-label="Add entry">+</button>
<nav id="nav">
  <button data-v="today"><span>⏱</span>Today</button>
  <button data-v="log"><span>📋</span>Log</button>
  <button data-v="summary"><span>📊</span>Summary</button>
  <button data-v="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>
<noscript>This app needs JavaScript.</noscript>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s,r){return (r||document).querySelector(s)};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad = function(n){return String(n).padStart(2,'0')};
var ymd = function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var hm = function(d){return pad(d.getHours())+':'+pad(d.getMinutes())};
var parseYmd = function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var toMin = function(t){var p=t.split(':').map(Number);return p[0]*60+p[1]};
var fmt = function(m){m=Math.max(0,Math.round(m));return Math.floor(m/60)+'h '+pad(m%60)+'m'};
var uid = function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
function rawDur(start,end){var d=toMin(end)-toMin(start);if(d<0)d+=1440;return d}
function dur(e){return Math.max(0,rawDur(e.start,e.end)-(+e.brk||0))}
function dayLabel(s){return parseYmd(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}
function monthLabel(){return new Date(ui.y,ui.m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}

/* ---------- storage ---------- */
var KEY='timesheet.data.v1';
var mem=null;
function defaults(){
  return {entries:[],active:null,settings:{target:8,weekStart:1,rate:0,currency:'',projects:['General']}};
}
function load(){
  var d=defaults(),raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){raw=mem}
  if(raw){
    try{
      var p=JSON.parse(raw);
      if(p&&Array.isArray(p.entries))d.entries=p.entries.filter(validEntry);
      if(p&&p.active&&typeof p.active.start==='number')d.active=p.active;
      if(p&&p.settings)Object.keys(d.settings).forEach(function(k){if(p.settings[k]!==undefined)d.settings[k]=p.settings[k]});
      if(!Array.isArray(d.settings.projects)||!d.settings.projects.length)d.settings.projects=['General'];
    }catch(e){}
  }
  return d;
}
function validEntry(e){
  return e&&typeof e.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&/^\d{2}:\d{2}$/.test(e.start)&&/^\d{2}:\d{2}$/.test(e.end);
}
function save(){
  var s=JSON.stringify(S);
  try{localStorage.setItem(KEY,s)}catch(e){mem=s}
}
var S=load();
var view='today';
var now0=new Date();
var ui={y:now0.getFullYear(),m:now0.getMonth()};

/* ---------- calculations ---------- */
function targetMin(){return Math.round((+S.settings.target||0)*60)}
function byStart(a,b){return a.start<b.start?-1:a.start>b.start?1:0}
function monthEntries(){
  var pre=ui.y+'-'+pad(ui.m+1)+'-';
  return S.entries.filter(function(e){return e.date.indexOf(pre)===0});
}
function dayTotals(list){
  var t={};
  list.forEach(function(e){t[e.date]=(t[e.date]||0)+dur(e)});
  return t;
}
function weekStartOf(d){
  var diff=(d.getDay()-(+S.settings.weekStart)+7)%7;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff);
}
function stats(list){
  var days=dayTotals(list),tm=targetMin(),total=0,worked=0,ot=0,proj={},weeks={};
  Object.keys(days).forEach(function(k){
    var m=days[k];total+=m;if(m>0)worked++;
    if(tm>0&&m>tm)ot+=m-tm;
    var w=ymd(weekStartOf(parseYmd(k)));weeks[w]=(weeks[w]||0)+m;
  });
  list.forEach(function(e){proj[e.project]=(proj[e.project]||0)+dur(e)});
  return {total:total,worked:worked,ot:ot,proj:proj,weeks:weeks,days:days};
}
function money(mins){
  var r=+S.settings.rate||0;if(r<=0)return '';
  return ((mins/60)*r).toFixed(2)+(S.settings.currency?' '+S.settings.currency:'');
}
function runningToday(){
  if(!S.active)return 0;
  var mid=new Date();mid.setHours(0,0,0,0);
  return Math.max(0,Math.floor((Date.now()-Math.max(S.active.start,mid.getTime()))/60000));
}

/* ---------- ui bits ---------- */
var toastT;
function toast(msg){
  var t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},2300);
}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show');$('#sheet').innerHTML='';resolver=null}
var resolver=null;
function ask(msg,okLabel){
  return new Promise(function(res){
    openModal('<h3>'+esc(msg)+'</h3><div class="btns"><button class="btn ghost" data-a="ask-no">Cancel</button><button class="btn danger" data-a="ask-yes">'+esc(okLabel||'Confirm')+'</button></div>');
    resolver=res;
  });
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Copied')},function(){fallbackCopy()});
  }else fallbackCopy();
  function fallbackCopy(){
    var ta=$('#exp');if(!ta)return;
    ta.select();
    try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy it')}
  }
}
function download(name,text,mime){
  try{
    var blob=new Blob(['﻿'+text],{type:mime});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('Download started');
  }catch(e){toast('Download not available here — use Copy')}
}
var exportData={};
function showExport(title,text,name,mime){
  exportData={text:text,name:name,mime:mime};
  var canShare=!!navigator.share;
  openModal('<h3>'+esc(title)+'</h3><textarea id="exp" readonly>'+esc(text)+'</textarea>'+
    '<div class="btns"><button class="btn" data-a="exp-copy">Copy</button>'+
    (canShare?'<button class="btn ghost" data-a="exp-share">Share</button>':'')+
    '<button class="btn ghost" data-a="exp-dl">Download</button></div>'+
    '<div class="btns"><button class="btn ghost" data-a="close">Close</button></div>');
}

/* ---------- views ---------- */
function projOptions(sel){
  var list=S.settings.projects.slice();
  if(sel&&list.indexOf(sel)<0)list.push(sel);
  return list.map(function(p){return '<option value="'+esc(p)+'"'+(p===sel?' selected':'')+'>'+esc(p)+'</option>'}).join('');
}
function entryRow(e){
  return '<button class="row" data-a="edit" data-id="'+esc(e.id)+'"><div><b>'+esc(e.project)+'</b>'+
    '<div class="muted small">'+e.start+' – '+e.end+(e.brk?' · break '+e.brk+'m':'')+(e.note?' · '+esc(e.note):'')+'</div></div>'+
    '<div class="dur">'+fmt(dur(e))+'</div></button>';
}
function vToday(){
  var now=new Date(),today=ymd(now);
  var es=S.entries.filter(function(e){return e.date===today}).sort(byStart);
  var done=es.reduce(function(a,e){return a+dur(e)},0);
  var total=done+runningToday(),tm=targetMin();
  var h='<section class="card hero"><div class="muted">'+esc(now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}))+'</div>';
  if(S.active){
    var st=new Date(S.active.start);
    h+='<div class="timer" id="timer">00:00:00</div>'+
       '<div class="muted">Working since '+hm(st)+' · '+esc(S.active.project)+(S.active.note?' · '+esc(S.active.note):'')+'</div>'+
       '<label>Break taken (minutes)<input id="brk" type="number" inputmode="numeric" min="0" step="5" value="0"></label>'+
       '<button class="btn big danger" data-a="out">Clock out</button>';
  }else{
    h+='<div class="timer" style="font-size:34px;color:var(--muted)">Not clocked in</div>'+
       '<label>Project<select id="proj">'+projOptions(S.settings.projects[0])+'</select></label>'+
       '<label>Note (optional)<input id="note" maxlength="80" placeholder="What are you working on?"></label>'+
       '<button class="btn big" data-a="in">Clock in</button>';
  }
  h+='</section>';
  h+='<section class="card"><div class="line"><span>Today</span><b id="todayTot">'+fmt(total)+'</b></div>';
  if(tm>0){
    h+='<div class="bar"><i id="todayBar" style="width:'+Math.min(100,total/tm*100)+'%"></i></div>'+
       '<div class="muted small" style="margin-top:6px">Target '+fmt(tm)+'</div>';
  }
  h+='</section>';
  h+='<section class="card"><h4>Today\'s entries</h4>'+
     (es.length?es.map(entryRow).join(''):'<div class="empty" style="padding:10px">Nothing logged yet today.</div>')+
     '<button class="btn ghost sm" style="margin-top:10px" data-a="new">+ Add entry manually</button></section>';
  return h;
}
function monthNav(){
  return '<div class="month"><button data-a="prev" aria-label="Previous month">‹</button><b>'+esc(monthLabel())+'</b><button data-a="next" aria-label="Next month">›</button></div>';
}
function vLog(){
  var list=monthEntries(),st=stats(list),tm=targetMin();
  var h=monthNav();
  if(!list.length)return h+'<div class="card empty">No entries this month.<br>Tap + to add one.</div>';
  var dates=Object.keys(st.days).sort().reverse();
  dates.forEach(function(d){
    var mins=st.days[d],ot=tm>0&&mins>tm?mins-tm:0;
    var es=list.filter(function(e){return e.date===d}).sort(byStart);
    h+='<section class="card"><div class="dayhead"><b>'+esc(dayLabel(d))+'</b><span class="dur">'+fmt(mins)+(ot?'<span class="badge">+'+fmt(ot)+'</span>':'')+'</span></div>'+es.map(entryRow).join('')+'</section>';
  });
  return h;
}
function vSummary(){
  var list=monthEntries(),st=stats(list);
  var h=monthNav();
  var avg=st.worked?st.total/st.worked:0;
  h+='<div class="stats">'+
    '<div class="stat"><b>'+fmt(st.total)+'</b><span>Total hours</span></div>'+
    '<div class="stat"><b>'+st.worked+'</b><span>Days worked</span></div>'+
    '<div class="stat"><b>'+fmt(st.ot)+'</b><span>Overtime</span></div>'+
    '<div class="stat"><b>'+fmt(avg)+'</b><span>Average per day</span></div></div>';
  var earn=money(st.total);
  if(earn)h+='<section class="card"><div class="line"><span>Earnings</span><b>'+esc(earn)+'</b></div></section>';
  var pk=Object.keys(st.proj).sort(function(a,b){return st.proj[b]-st.proj[a]});
  if(pk.length){
    h+='<section class="card"><h4>By project</h4>';
    pk.forEach(function(p){
      h+='<div style="margin-bottom:10px"><div class="line" style="padding:0"><span>'+esc(p)+'</span><b>'+fmt(st.proj[p])+'</b></div>'+
         '<div class="bar"><i style="width:'+(st.total?st.proj[p]/st.total*100:0)+'%"></i></div></div>';
    });
    h+='</section>';
  }
  var wk=Object.keys(st.weeks).sort();
  if(wk.length){
    h+='<section class="card"><h4>By week</h4>';
    wk.forEach(function(w){
      h+='<div class="line"><span>Week of '+esc(parseYmd(w).toLocaleDateString(undefined,{day:'numeric',month:'short'}))+'</span><b>'+fmt(st.weeks[w])+'</b></div>';
    });
    h+='</section>';
  }
  h+='<button class="btn big" data-a="csv">Export this month (CSV)</button>';
  return h;
}
function vSettings(){
  var s=S.settings;
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var h='<section class="card"><h3>Work</h3>'+
    '<label>Daily target (hours)<input type="number" inputmode="decimal" step="0.25" min="0" max="24" data-set="target" value="'+esc(s.target)+'"></label>'+
    '<div class="muted small">Time beyond this on a single day counts as overtime. Use 0 to switch overtime off.</div>'+
    '<label>Week starts on<select data-set="weekStart">'+days.map(function(d,i){return '<option value="'+i+'"'+(i==s.weekStart?' selected':'')+'>'+d+'</option>'}).join('')+'</select></label>'+
    '<div class="two"><label>Hourly rate (optional)<input type="number" inputmode="decimal" step="0.01" min="0" data-set="rate" value="'+esc(s.rate||'')+'" placeholder="0"></label>'+
    '<label>Currency<input data-set="currency" maxlength="5" value="'+esc(s.currency)+'" placeholder="EGP"></label></div></section>';
  h+='<section class="card"><h3>Projects</h3><div class="chips">'+
    s.projects.map(function(p,i){return '<span class="chip">'+esc(p)+(s.projects.length>1?'<button data-a="rmproj" data-i="'+i+'" aria-label="Remove">×</button>':'')+'</span>'}).join('')+'</div>'+
    '<div class="addrow"><input id="newproj" maxlength="40" placeholder="New project name"><button class="btn" data-a="addproj">Add</button></div></section>';
  h+='<section class="card"><h3>Data</h3>'+
    '<div class="muted small" style="margin-bottom:10px">Everything is stored on this device only.</div>'+
    '<div class="btns" style="margin-top:0"><button class="btn ghost" data-a="backup">Backup</button><button class="btn ghost" data-a="restore">Restore</button></div>'+
    '<div class="btns"><button class="btn ghost" data-a="csvall">Export all (CSV)</button><button class="btn danger" data-a="wipe">Erase all</button></div></section>';
  return h;
}
function render(){
  var v=$('#view');
  v.innerHTML={today:vToday,log:vLog,summary:vSummary,settings:vSettings}[view]();
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.dataset.v===view)});
  $('#fab').style.display=view==='log'?'block':'none';
  tick();
}

/* ---------- live timer ---------- */
function tick(){
  if(!S.active)return;
  var t=$('#timer');if(!t)return;
  var sec=Math.max(0,Math.floor((Date.now()-S.active.start)/1000));
  t.textContent=pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec/60)%60)+':'+pad(sec%60);
  var es=S.entries.filter(function(e){return e.date===ymd(new Date())});
  var total=es.reduce(function(a,e){return a+dur(e)},0)+runningToday();
  var tt=$('#todayTot');if(tt)tt.textContent=fmt(total);
  var bar=$('#todayBar'),tm=targetMin();
  if(bar&&tm>0)bar.style.width=Math.min(100,total/tm*100)+'%';
}
setInterval(tick,250);

/* ---------- entry form ---------- */
function entryForm(id){
  var e=id?S.entries.filter(function(x){return x.id===id})[0]:null;
  if(id&&!e)return;
  var v=e||{date:ymd(new Date()),start:'09:00',end:'17:00',brk:0,project:S.settings.projects[0],note:''};
  openModal('<h3>'+(e?'Edit entry':'New entry')+'</h3>'+
    '<input type="hidden" id="f-id" value="'+esc(id||'')+'">'+
    '<label>Date<input type="date" id="f-date" value="'+esc(v.date)+'"></label>'+
    '<div class="two"><label>Start<input type="time" id="f-start" value="'+esc(v.start)+'"></label>'+
    '<label>End<input type="time" id="f-end" value="'+esc(v.end)+'"></label></div>'+
    '<label>Break (minutes)<input type="number" inputmode="numeric" id="f-brk" min="0" step="5" value="'+(+v.brk||0)+'"></label>'+
    '<label>Project<select id="f-proj">'+projOptions(v.project)+'</select></label>'+
    '<label>Note<input id="f-note" maxlength="80" value="'+esc(v.note)+'"></label>'+
    '<div class="muted" id="f-prev" style="margin-top:6px"></div>'+
    '<div class="btns"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="save">Save</button></div>'+
    (e?'<div class="btns"><button class="btn danger" data-a="del" data-id="'+esc(id)+'">Delete entry</button></div>':''));
  previewForm();
}
function previewForm(){
  var p=$('#f-prev');if(!p)return;
  var s=$('#f-start').value,e=$('#f-end').value,b=+$('#f-brk').value||0;
  if(!s||!e){p.textContent='';return}
  var d=Math.max(0,rawDur(s,e)-b);
  p.textContent='Duration: '+fmt(d)+(toMin(e)<toMin(s)?' (ends next day)':'');
}
function saveForm(){
  var id=$('#f-id').value,date=$('#f-date').value,s=$('#f-start').value,e=$('#f-end').value;
  var b=Math.max(0,Math.round(+$('#f-brk').value||0));
  if(!date||!s||!e){toast('Please fill in date, start and end');return}
  if(s===e){toast('Start and end are the same');return}
  if(b>=rawDur(s,e)){toast('Break is longer than the shift');return}
  var rec={id:id||uid(),date:date,start:s,end:e,brk:b,project:$('#f-proj').value,note:$('#f-note').value.trim()};
  if(id){S.entries=S.entries.map(function(x){return x.id===id?rec:x})}else S.entries.push(rec);
  var d=parseYmd(date);ui.y=d.getFullYear();ui.m=d.getMonth();
  save();closeModal();render();toast('Saved');
}

/* ---------- clock in/out ---------- */
function clockIn(){
  S.active={start:Date.now(),project:$('#proj').value,note:$('#note').value.trim()};
  save();render();
}
function clockOut(){
  var a=S.active;if(!a)return;
  var st=new Date(a.start),en=new Date();
  var b=Math.max(0,Math.round(+($('#brk')||{}).value||0));
  var hrs=(en-st)/3600000;
  var rec={id:uid(),date:ymd(st),start:hm(st),end:hm(en),brk:0,project:a.project,note:a.note||''};
  var raw=rawDur(rec.start,rec.end);
  rec.brk=b<raw?b:0;
  S.active=null;
  if(rec.start===rec.end&&hrs<12){toast('Shift under a minute — discarded');save();render();return}
  S.entries.push(rec);save();render();
  if(hrs>16){toast('Long shift — please check this entry');entryForm(rec.id)}
  else toast('Saved '+fmt(dur(rec)));
}

/* ---------- export / import ---------- */
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCsv(list){
  var rows=[['Date','Start','End','Break (min)','Hours','Project','Note']];
  list.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:byStart(a,b)}).forEach(function(e){
    rows.push([e.date,e.start,e.end,e.brk||0,(dur(e)/60).toFixed(2),e.project,e.note||'']);
  });
  return rows.map(function(r){return r.map(csvCell).join(',')}).join('\n');
}
function restoreForm(){
  openModal('<h3>Restore backup</h3><div class="muted small">Paste the backup text below. This replaces all current data.</div>'+
    '<textarea id="imp" placeholder="Paste backup here"></textarea>'+
    '<div class="btns"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="doimport">Restore</button></div>');
}
function doImport(){
  var raw=$('#imp').value.trim(),p;
  try{p=JSON.parse(raw)}catch(e){toast('That is not a valid backup');return}
  if(!p||!Array.isArray(p.entries)){toast('That is not a valid backup');return}
  var d=defaults();
  d.entries=p.entries.filter(validEntry).map(function(e){return {id:e.id,date:e.date,start:e.start,end:e.end,brk:Math.max(0,+e.brk||0),project:String(e.project||'General'),note:String(e.note||'')}});
  if(p.settings)Object.keys(d.settings).forEach(function(k){if(p.settings[k]!==undefined)d.settings[k]=p.settings[k]});
  if(!Array.isArray(d.settings.projects)||!d.settings.projects.length)d.settings.projects=['General'];
  S=d;save();closeModal();render();toast('Restored '+S.entries.length+' entries');
}

/* ---------- settings ---------- */
function setSetting(k,v){
  var s=S.settings;
  if(k==='target'){var n=parseFloat(v);s.target=isNaN(n)?8:Math.min(24,Math.max(0,n))}
  else if(k==='weekStart')s.weekStart=+v;
  else if(k==='rate'){var r=parseFloat(v);s.rate=isNaN(r)?0:Math.max(0,r)}
  else if(k==='currency')s.currency=v.trim();
  save();toast('Saved');
}

/* ---------- events ---------- */
function changeMonth(d){
  var x=new Date(ui.y,ui.m+d,1);ui.y=x.getFullYear();ui.m=x.getMonth();render();
}
document.addEventListener('click',function(ev){
  var nb=ev.target.closest('#nav button');
  if(nb){view=nb.dataset.v;render();window.scrollTo(0,0);return}
  if(ev.target.id==='modal'){closeModal();return}
  var t=ev.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a;
  switch(a){
    case 'in':clockIn();break;
    case 'out':clockOut();break;
    case 'new':entryForm(null);break;
    case 'edit':entryForm(t.dataset.id);break;
    case 'save':saveForm();break;
    case 'close':closeModal();break;
    case 'del':
      var id=t.dataset.id;
      ask('Delete this entry?','Delete').then(function(ok){
        if(ok){S.entries=S.entries.filter(function(e){return e.id!==id});save();closeModal();render();toast('Deleted')}
      });break;
    case 'ask-yes':var r1=resolver;resolver=null;closeModal();if(r1)r1(true);break;
    case 'ask-no':var r2=resolver;resolver=null;closeModal();if(r2)r2(false);break;
    case 'prev':changeMonth(-1);break;
    case 'next':changeMonth(1);break;
    case 'csv':showExport('CSV – '+monthLabel(),toCsv(monthEntries()),'timesheet-'+ui.y+'-'+pad(ui.m+1)+'.csv','text/csv');break;
    case 'csvall':showExport('CSV – all entries',toCsv(S.entries),'timesheet-all.csv','text/csv');break;
    case 'backup':showExport('Backup',JSON.stringify({app:'timesheet',version:1,entries:S.entries,settings:S.settings}),'timesheet-backup.json','application/json');break;
    case 'restore':restoreForm();break;
    case 'doimport':doImport();break;
    case 'exp-copy':copyText(exportData.text);break;
    case 'exp-dl':download(exportData.name,exportData.text,exportData.mime);break;
    case 'exp-share':
      navigator.share({title:exportData.name,text:exportData.text}).catch(function(){});break;
    case 'addproj':
      var inp=$('#newproj'),name=inp.value.trim();
      if(!name)break;
      if(S.settings.projects.some(function(p){return p.toLowerCase()===name.toLowerCase()})){toast('Project already exists');break}
      S.settings.projects.push(name);save();render();break;
    case 'rmproj':
      if(S.settings.projects.length>1){S.settings.projects.splice(+t.dataset.i,1);save();render()}break;
    case 'wipe':
      ask('Erase ALL entries and settings? This cannot be undone.','Erase everything').then(function(ok){
        if(ok){S=defaults();save();render();toast('All data erased')}
      });break;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target.closest('[data-set]');if(t)setSetting(t.dataset.set,t.value);
});
document.addEventListener('input',function(ev){
  if(/^f-(start|end|brk)$/.test(ev.target.id))previewForm();
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();if(view==='today')render()}});

render();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
})();
</script>
</body>
